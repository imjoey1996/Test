<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlatoX Simulators</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Rajdhani:wght@600;700;900&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0a0f; 
            --bg-card: rgba(18, 18, 26, 0.65); 
            --primary: #ffffff; 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-active-glow: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: 'Cairo', sans-serif;
            position: relative; padding-bottom: 50px; display: flex; flex-direction: column; align-items: center;
        }

        .static-gaming-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -3; pointer-events: none;
            background-color: var(--bg-main);
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .glass-panel { 
            background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 8px 30px 0 rgba(0, 0, 0, 0.35); 
        }

        section { padding: 35px 15px 25px; width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
        
        .section-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 25px; position: relative; text-align: center; }

        .fit-btn, .cancel-btn {
            border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 8px 15px; font-family: inherit;
        }
        .fit-btn { background: var(--primary); color: var(--bg-main); font-weight: 900; }
        .fit-btn:hover { box-shadow: 0 0 15px var(--btn-active-glow); }
        .cancel-btn { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--glass-border); }

        /* حاويات العرض للتبديل بين القائمة والألعاب */
        .view-section { display: none; width: 100%; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; }
        .view-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- تصميم القائمة الرئيسية (Hub) --- */
        #sim-hub { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .sim-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 16px; 
            padding: 20px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: 0.3s;
        }
        .sim-card:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.3); }
        .sim-card i { font-size: 35px; color: var(--primary); width: 40px; text-align: center; }
        .sim-card-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; font-weight: 900; }
        .sim-card-info p { margin: 0; font-size: 12px; color: var(--text-muted); }

        .back-btn { align-self: flex-start; margin-bottom: 20px; }

        /* --- تصميم الروليت --- */
        .roulette-wrapper { width: 100%; max-width: 400px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .r-canvas-box { position: relative; margin-bottom: 5px; }
        #rouletteCanvas { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 3px solid #fff; width: 280px; height: 280px; }
        .r-pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 25px solid #ef4444; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); z-index: 10;
        }
        .names-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #fff;
            padding: 10px; border-radius: 8px; font-family: inherit; resize: vertical; min-height: 60px; outline: none; text-align: center;
        }
        .names-input:focus { border-color: var(--primary); }

        /* --- تصميم البلياردو --- */
        .billiards-wrapper { width: 100%; max-width: 450px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; }
        
        .b-controls { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .b-input-box { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--glass-border); font-size: 13px; font-weight: bold; }
        .b-input-box input { width: 35px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); color: var(--primary); text-align: center; border-radius: 6px; padding: 2px; font-weight: 900; outline: none; font-family: 'Rajdhani', sans-serif; }
        
        .b-canvas-box { width: 100%; display: flex; justify-content: center; position: relative; }
        #billiardsCanvas {
            width: 280px; height: 530px; border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            touch-action: none; cursor: grab; background: #000;
        }
        #billiardsCanvas:active { cursor: grabbing; }

        /* زر وواجهة السبين (Spin) */
        .spin-btn-container { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .spin-toggle { width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 2px solid #555; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; position: relative; display: flex; justify-content: center; align-items: center; }
        .spin-dot-indicator { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; position: absolute; }
        
        .spin-modal { display: none; position: absolute; right: 60px; top: 50%; transform: translateY(-50%); background: rgba(20,20,25,0.95); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 20; flex-direction: column; align-items: center; }
        .spin-modal.active { display: flex; animation: fadeIn 0.2s; }
        .spin-area { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #ddd); border: 2px solid #666; position: relative; cursor: crosshair; touch-action: none; }
        .spin-crosshair { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,0,0,0.2); pointer-events: none; }
        .spin-crosshair.vert { top: 0; left: 50%; width: 1px; height: 100%; }
        .spin-dot { position: absolute; width: 14px; height: 14px; background: #ef4444; border-radius: 50%; border: 2px solid #fff; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .close-spin { margin-top: 10px; font-size: 12px; padding: 4px 15px; }

        .winner-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(15, 15, 20, 0.95); padding: 15px 30px; border-radius: 12px; border: 2px solid var(--primary); color: #fff; font-size: 1.3rem; font-weight: 900; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: 0.3s; z-index: 20; width: 85%; }
        .winner-popup.show { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <div class="static-gaming-bg"></div>

    <section>
        <h2 class="section-title">محاكي الألعاب | Simulators</h2>

        <div id="view-hub" class="view-section active">
            <div id="sim-hub">
                <div class="sim-card glass-panel" onclick="openSim('billiards')">
                    <i class="fa-solid fa-bowling-ball"></i>
                    <div class="sim-card-info">
                        <h3>محاكي البلياردو</h3>
                        <p>وزنية ومسار كرات 8-Ball مع تحكم بالسبين.</p>
                    </div>
                </div>
                <div class="sim-card glass-panel" onclick="openSim('roulette')">
                    <i class="fa-solid fa-dharmachakra"></i>
                    <div class="sim-card-info">
                        <h3>روليت الأسماء</h3>
                        <p>عجلة حظ لتدوير واختيار الأسماء العشوائية.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-roulette" class="view-section">
            <button class="cancel-btn back-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> رجوع للقائمة</button>
            <div class="glass-panel roulette-wrapper">
                <div class="r-canvas-box">
                    <div class="r-pointer"></div>
                    <canvas id="rouletteCanvas" width="280" height="280"></canvas>
                    <div id="winnerPopup" class="winner-popup">الفائز!</div>
                </div>
                <button class="fit-btn" style="width: 100%;" onclick="spinRoulette()"><i class="fa-solid fa-rotate-right"></i> فر العجلة</button>
                <textarea id="rouletteNames" class="names-input">YYY, YYY, YYY</textarea>
                <div style="width: 100%; display: flex; gap: 8px;">
                    <button class="cancel-btn" style="flex: 1;" onclick="updateRouletteWheel()"><i class="fa-solid fa-check"></i> تحديث</button>
                    <button class="cancel-btn" style="flex: 1; color: #eab308;" onclick="resetRouletteNames()"><i class="fa-solid fa-rotate-left"></i> إعادة</button>
                </div>
            </div>
        </div>

        <div id="view-billiards" class="view-section">
            <button class="cancel-btn back-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> رجوع للقائمة</button>
            <div class="glass-panel billiards-wrapper">
                
                <div class="b-controls">
                    <div class="b-input-box">
                        <label>الكرات:</label>
                        <input type="number" id="ballCountInput" min="1" max="15" value="15">
                    </div>
                    <button type="button" class="fit-btn" onclick="initPoolBalls('triangle')"><i class="fa-solid fa-play"></i> ترتيب</button>
                    <button type="button" class="cancel-btn" onclick="initPoolBalls('clear')" style="color: #ef4444;"><i class="fa-solid fa-trash"></i> مسح</button>
                </div>

                <div class="b-canvas-box">
                    <canvas id="billiardsCanvas" width="280" height="530"></canvas>
                    
                    <div class="spin-btn-container">
                        <div class="spin-toggle" onclick="toggleSpinModal()" title="إعدادات السبين">
                            <div class="spin-dot-indicator" id="spinIndicator"></div>
                        </div>
                    </div>

                    <div class="spin-modal" id="spinModal">
                        <span style="color: #fff; font-size: 12px; margin-bottom: 8px; font-weight: bold;">تحكم السبين</span>
                        <div class="spin-area" id="spinArea">
                            <div class="spin-crosshair"></div>
                            <div class="spin-crosshair vert"></div>
                            <div class="spin-dot" id="spinDotMain"></div>
                        </div>
                        <button class="cancel-btn close-spin" onclick="toggleSpinModal()">إغلاق</button>
                    </div>

                </div>
                <div style="display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: var(--text-muted); font-weight: bold; padding: 0 10px;">
                    <span id="billiards-power-text">القوة: 0%</span>
                </div>
            </div>
        </div>

    </section>

    <script>
        // دالة التنقل بين الشاشات
        function openSim(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            if(viewId === 'roulette') drawRouletteWheel();
            if(viewId === 'billiards') drawPoolTable();
        }

        /* =========================================================================
           1. محاكي الروليت (Physics-based Roulette)
           ========================================================================= */
        const rCanvas = document.getElementById("rouletteCanvas");
        const rCtx = rCanvas.getContext("2d");
        const winnerPopup = document.getElementById("winnerPopup");
        
        let rNames = [];
        let rColors = ['#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471', '#34495E', '#16A085', '#E67E22'];
        let startAngle = 0;
        let arc = 0;
        let spinVelocity = 0;
        let isSpinning = false;
        
        function updateRouletteWheel() {
            const text = document.getElementById('rouletteNames').value;
            rNames = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            if(rNames.length === 0) rNames = ["فارغ"];
            arc = Math.PI * 2 / rNames.length;
            winnerPopup.classList.remove('show');
            drawRouletteWheel();
        }

        function resetRouletteNames() {
            document.getElementById('rouletteNames').value = 'YYY, YYY, YYY';
            updateRouletteWheel();
        }

        function drawRouletteWheel() {
            rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
            let outsideRadius = 135;
            let textRadius = 90;
            let insideRadius = 25;
            const cx = rCanvas.width / 2;
            const cy = rCanvas.height / 2;

            for(let i = 0; i < rNames.length; i++) {
                let angle = startAngle + i * arc;
                rCtx.fillStyle = rColors[i % rColors.length];
                
                rCtx.beginPath();
                rCtx.arc(cx, cy, outsideRadius, angle, angle + arc, false);
                rCtx.arc(cx, cy, insideRadius, angle + arc, angle, true);
                rCtx.fill();
                
                rCtx.save();
                rCtx.fillStyle = "#ffffff";
                rCtx.shadowBlur = 2; rCtx.shadowColor = "rgba(0,0,0,0.5)";
                rCtx.translate(cx + Math.cos(angle + arc / 2) * textRadius, cy + Math.sin(angle + arc / 2) * textRadius);
                rCtx.rotate(angle + arc / 2);
                rCtx.textAlign = "right";
                rCtx.font = "bold 16px Cairo";
                rCtx.fillText(rNames[i], 30, 5);
                rCtx.restore();
            }
            rCtx.beginPath(); rCtx.arc(cx, cy, insideRadius, 0, Math.PI * 2); rCtx.fillStyle = "#111"; rCtx.fill();
        }

        function spinRoulette() {
            if(rNames.length <= 1 || isSpinning) return;
            winnerPopup.classList.remove('show');
            // إعطاء سرعة ابتدائية عشوائية قوية لدوران واقعي
            spinVelocity = Math.random() * 0.2 + 0.4; 
            isSpinning = true;
            animateRoulette();
        }

        function animateRoulette() {
            if (spinVelocity > 0.001) {
                startAngle += spinVelocity;
                spinVelocity *= 0.985; // احتكاك ناعم
                drawRouletteWheel();
                requestAnimationFrame(animateRoulette);
            } else {
                spinVelocity = 0;
                isSpinning = false;
                showWinner();
            }
        }

        function showWinner() {
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            if (index < 0) index = rNames.length - (Math.abs(index) % rNames.length);
            if (index === rNames.length) index = 0;
            
            winnerPopup.innerHTML = "🎉 " + rNames[index] + " 🎉";
            winnerPopup.classList.add('show');
        }
        updateRouletteWheel();


        /* =========================================================================
           2. محاكي البلياردو (Pro Billiards Simulator)
           ========================================================================= */
        const poolCanvas = document.getElementById('billiardsCanvas');
        const poolCtx = poolCanvas.getContext('2d');

        const TABLE_WIDTH = 280;
        const TABLE_HEIGHT = 530;
        const CUSHION = 22; 
        const PLAY_LEFT = CUSHION;
        const PLAY_RIGHT = TABLE_WIDTH - CUSHION;
        const PLAY_TOP = CUSHION;
        const PLAY_BOTTOM = TABLE_HEIGHT - CUSHION;
        const BALL_RADIUS = 8.5; 
        const POCKET_RADIUS = 14.5; // حجم مطابق للصورة 1
        const FRICTION = 0.988; // احتكاك سلس

        // إحداثيات الحفر في الزوايا تماماً
        const POCKETS = [
            { x: PLAY_LEFT - 2, y: PLAY_TOP - 2 }, { x: PLAY_RIGHT + 2, y: PLAY_TOP - 2 },
            { x: PLAY_LEFT - 4, y: TABLE_HEIGHT / 2 }, { x: PLAY_RIGHT + 4, y: TABLE_HEIGHT / 2 },
            { x: PLAY_LEFT - 2, y: PLAY_BOTTOM + 2 }, { x: PLAY_RIGHT + 2, y: PLAY_BOTTOM + 2 }
        ];

        const BALL_COLORS = ['#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471', '#2D3436', '#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471'];

        let poolBalls = [];
        let poolCueBall = null;
        let isAiming = false;
        let draggedBall = null;
        let aimStartPos = { x: 0, y: 0 };
        let aimCurrentPos = { x: 0, y: 0 };
        
        // إعدادات السبين (من -1 إلى 1)
        let spinX = 0; 
        let spinY = 0;

        class PoolBall {
            constructor(x, y, color = '#ffffff', number = 0, isCue = false) {
                this.x = x; this.y = y; this.vx = 0; this.vy = 0;
                this.radius = BALL_RADIUS; this.color = color;
                this.number = number; this.isCue = isCue; this.inPocket = false;
            }
            draw() {
                if (this.inPocket) return;
                poolCtx.save();
                poolCtx.translate(this.x, this.y);
                
                // ظل
                poolCtx.beginPath(); poolCtx.arc(1, 1.5, this.radius, 0, Math.PI * 2);
                poolCtx.fillStyle = 'rgba(0, 0, 0, 0.4)'; poolCtx.fill();

                // لون الكرة
                const grad = poolCtx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, 1, 0, 0, this.radius);
                grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, this.color); grad.addColorStop(1, '#111');
                poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius, 0, Math.PI * 2);
                poolCtx.fillStyle = grad; poolCtx.fill();

                if (!this.isCue && this.number > 0) {
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius * 0.55, 0, Math.PI * 2);
                    poolCtx.fillStyle = '#fff'; poolCtx.fill();
                    poolCtx.fillStyle = '#000'; poolCtx.font = 'bold 8px Arial';
                    poolCtx.textAlign = 'center'; poolCtx.textBaseline = 'middle';
                    poolCtx.fillText(this.number, 0, 0.5);
                }

                // رسم نقطة السبين على الكرة البيضاء
                if (this.isCue && (spinX !== 0 || spinY !== 0)) {
                    poolCtx.beginPath(); 
                    poolCtx.arc(spinX * this.radius * 0.6, spinY * this.radius * 0.6, 2, 0, Math.PI * 2);
                    poolCtx.fillStyle = '#ef4444'; poolCtx.fill();
                }

                poolCtx.restore();
            }
            update() {
                if (this.inPocket) return;
                this.x += this.vx; this.y += this.vy;
                this.vx *= FRICTION; this.vy *= FRICTION;

                if (Math.hypot(this.vx, this.vy) < 0.05) { this.vx = 0; this.vy = 0; }

                // ارتداد الجدران
                if (this.x - this.radius < PLAY_LEFT) { this.x = PLAY_LEFT + this.radius; this.vx = -this.vx * 0.9; } 
                else if (this.x + this.radius > PLAY_RIGHT) { this.x = PLAY_RIGHT - this.radius; this.vx = -this.vx * 0.9; }
                if (this.y - this.radius < PLAY_TOP) { this.y = PLAY_TOP + this.radius; this.vy = -this.vy * 0.9; } 
                else if (this.y + this.radius > PLAY_BOTTOM) { this.y = PLAY_BOTTOM - this.radius; this.vy = -this.vy * 0.9; }

                // السقوط في الحفر
                for (let p of POCKETS) {
                    if (Math.hypot(this.x - p.x, this.y - p.y) < POCKET_RADIUS - 1) {
                        this.inPocket = true; this.vx = 0; this.vy = 0;
                        if (this.isCue) setTimeout(() => { this.inPocket = false; this.x = TABLE_WIDTH/2; this.y = TABLE_HEIGHT*0.75; }, 1000);
                        break;
                    }
                }
            }
        }

        function initPoolBalls(mode = 'triangle') {
            poolBalls = [];
            poolCueBall = new PoolBall(TABLE_WIDTH / 2, TABLE_HEIGHT * 0.75, '#ffffff', 0, true);
            poolBalls.push(poolCueBall);

            let count = parseInt(document.getElementById('ballCountInput').value) || 15;
            count = Math.min(15, Math.max(1, count));

            if (mode === 'triangle') {
                const apexX = TABLE_WIDTH / 2;
                const apexY = PLAY_TOP + 80;
                let bIdx = 0;
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col <= row; col++) {
                        if (bIdx >= count) break;
                        let bx = apexX + (col * BALL_RADIUS * 2.1) - (row * BALL_RADIUS * 1.05);
                        let by = apexY + (row * BALL_RADIUS * 1.8);
                        poolBalls.push(new PoolBall(bx, by, BALL_COLORS[bIdx % 15], bIdx + 1));
                        bIdx++;
                    }
                }
            }
        }

        function getAimPrediction(cue, angle) {
            let dx = Math.cos(angle), dy = Math.sin(angle);
            let closestT = Infinity, hitType = 'none', hitTarget = null;
            
            // تحقق تصادم الجدار
            let tx = dx > 0 ? (PLAY_RIGHT - BALL_RADIUS - cue.x) / dx : dx < 0 ? (PLAY_LEFT + BALL_RADIUS - cue.x) / dx : Infinity;
            let ty = dy > 0 ? (PLAY_BOTTOM - BALL_RADIUS - cue.y) / dy : dy < 0 ? (PLAY_TOP + BALL_RADIUS - cue.y) / dy : Infinity;
            
            let wallNormX = 0, wallNormY = 0;
            if (tx > 0 && tx < closestT) { closestT = tx; hitType = 'wall'; wallNormX = dx > 0 ? -1 : 1; wallNormY = 0; }
            if (ty > 0 && ty < closestT) { closestT = ty; hitType = 'wall'; wallNormX = 0; wallNormY = dy > 0 ? -1 : 1; }

            // تحقق تصادم الكرات
            for (let b of poolBalls) {
                if (b === cue || b.inPocket) continue;
                let vX = cue.x - b.x, vY = cue.y - b.y;
                let b_coef = 2 * (vX * dx + vY * dy);
                let c_coef = vX * vX + vY * vY - (BALL_RADIUS*2)*(BALL_RADIUS*2);
                let disc = b_coef * b_coef - 4 * c_coef;
                if (disc >= 0) {
                    let t = (-b_coef - Math.sqrt(disc)) / 2;
                    if (t > 0 && t < closestT) { closestT = t; hitType = 'ball'; hitTarget = b; }
                }
            }
            return { t: closestT, type: hitType, target: hitTarget, dx, dy, nx: wallNormX, ny: wallNormY };
        }

        function drawPoolTable() {
            poolCtx.clearRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            
            // إطار الخشب
            poolCtx.fillStyle = '#6e3c1d'; 
            poolCtx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            
            // القماش الأخضر (كما في بلاتو)
            poolCtx.fillStyle = '#3a8a4b'; 
            poolCtx.fillRect(PLAY_LEFT, PLAY_TOP, PLAY_RIGHT - PLAY_LEFT, PLAY_BOTTOM - PLAY_TOP);

            // خط البداية (D-Line)
            poolCtx.strokeStyle = 'rgba(255,255,255,0.2)'; poolCtx.lineWidth = 1.5;
            poolCtx.beginPath(); poolCtx.moveTo(PLAY_LEFT, TABLE_HEIGHT * 0.75); poolCtx.lineTo(PLAY_RIGHT, TABLE_HEIGHT * 0.75); poolCtx.stroke();
            
            // الزوايا الفضية للإطار
            poolCtx.fillStyle = '#bdc3c7';
            const corners = [[0,0], [TABLE_WIDTH,0], [0,TABLE_HEIGHT], [TABLE_WIDTH,TABLE_HEIGHT]];
            corners.forEach(c => { poolCtx.beginPath(); poolCtx.arc(c[0], c[1], 30, 0, Math.PI*2); poolCtx.fill(); });

            // الحفر السوداء
            POCKETS.forEach(p => {
                poolCtx.beginPath(); poolCtx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI*2);
                poolCtx.fillStyle = '#050505'; poolCtx.fill();
            });

            poolBalls.forEach(b => b.draw());

            // رسم خوارزمية الوزنية (Aiming Lines)
            if (isAiming && poolCueBall && !poolCueBall.inPocket && !draggedBall) {
                let pullX = aimStartPos.x - aimCurrentPos.x;
                let pullY = aimStartPos.y - aimCurrentPos.y;
                let dist = Math.hypot(pullX, pullY);

                if (dist > 5) {
                    let angle = Math.atan2(pullY, pullX);
                    let pred = getAimPrediction(poolCueBall, angle);
                    let ghostX = poolCueBall.x + pred.dx * pred.t;
                    let ghostY = poolCueBall.y + pred.dy * pred.t;

                    // الخط الأبيض الأساسي
                    poolCtx.beginPath(); poolCtx.moveTo(poolCueBall.x, poolCueBall.y); poolCtx.lineTo(ghostX, ghostY);
                    poolCtx.strokeStyle = 'rgba(255,255,255,0.8)'; poolCtx.lineWidth = 1.2; poolCtx.stroke();

                    // شبح الكرة
                    poolCtx.beginPath(); poolCtx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI*2);
                    poolCtx.strokeStyle = 'rgba(255,255,255,0.6)'; poolCtx.lineWidth = 1; poolCtx.stroke();

                    if (pred.type === 'ball') {
                        // ارتداد الكرات (خط أحمر للهدف، خط أبيض للبيضاء)
                        let nx = pred.target.x - ghostX, ny = pred.target.y - ghostY;
                        let nLen = Math.hypot(nx, ny); nx /= nLen; ny /= nLen;
                        
                        poolCtx.beginPath(); poolCtx.moveTo(pred.target.x, pred.target.y);
                        poolCtx.lineTo(pred.target.x + nx * 100, pred.target.y + ny * 100);
                        poolCtx.strokeStyle = '#ff3333'; poolCtx.lineWidth = 2; poolCtx.stroke();

                        let tx = -ny, ty = nx;
                        if (pred.dx * tx + pred.dy * ty < 0) { tx = -tx; ty = -ty; }
                        poolCtx.beginPath(); poolCtx.moveTo(ghostX, ghostY); poolCtx.lineTo(ghostX + tx * 35, ghostY + ty * 35);
                        poolCtx.strokeStyle = 'rgba(255,255,255,0.8)'; poolCtx.lineWidth = 1.2; poolCtx.stroke();
                    
                    } else if (pred.type === 'wall') {
                        // ارتداد من الجدار (Bank Shot) باللون الأحمر كما طلبت
                        let rx = pred.dx, ry = pred.dy;
                        if (pred.nx !== 0) rx = -rx;
                        if (pred.ny !== 0) ry = -ry;
                        
                        poolCtx.beginPath(); poolCtx.moveTo(ghostX, ghostY);
                        poolCtx.lineTo(ghostX + rx * 80, ghostY + ry * 80);
                        poolCtx.strokeStyle = '#ff3333'; poolCtx.lineWidth = 1.5; poolCtx.setLineDash([5, 5]); poolCtx.stroke();
                        poolCtx.setLineDash([]);
                    }
                }
            }
        }

        function poolGameLoop() {
            for(let i=0; i<poolBalls.length; i++) {
                for(let j=i+1; j<poolBalls.length; j++) {
                    let b1 = poolBalls[i], b2 = poolBalls[j];
                    if(b1.inPocket || b2.inPocket) continue;
                    let dx = b2.x - b1.x, dy = b2.y - b1.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < BALL_RADIUS * 2) {
                        let overlap = (BALL_RADIUS * 2) - dist;
                        let nx = dx / dist, ny = dy / dist;
                        b1.x -= nx * (overlap/2); b1.y -= ny * (overlap/2);
                        b2.x += nx * (overlap/2); b2.y += ny * (overlap/2);
                        let kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / 2;
                        b1.vx -= p * nx; b1.vy -= p * ny;
                        b2.vx += p * nx; b2.vy += p * ny;
                    }
                }
            }
            poolBalls.forEach(b => b.update());
            drawPoolTable();
            requestAnimationFrame(poolGameLoop);
        }

        function getCanvasCoordinates(e) {
            const rect = poolCanvas.getBoundingClientRect();
            const scaleX = TABLE_WIDTH / rect.width;
            const scaleY = TABLE_HEIGHT / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function handlePointerDown(e) {
            const pos = getCanvasCoordinates(e);
            draggedBall = poolBalls.find(b => !b.inPocket && Math.hypot(b.x - pos.x, b.y - pos.y) < BALL_RADIUS * 2);
            if (draggedBall) {
                isAiming = false;
            } else if (poolCueBall && !poolCueBall.inPocket) {
                isAiming = true; aimStartPos = pos; aimCurrentPos = pos;
            }
        }

        function handlePointerMove(e) {
            const pos = getCanvasCoordinates(e);
            if (draggedBall) {
                draggedBall.x = Math.max(PLAY_LEFT + BALL_RADIUS, Math.min(PLAY_RIGHT - BALL_RADIUS, pos.x));
                draggedBall.y = Math.max(PLAY_TOP + BALL_RADIUS, Math.min(PLAY_BOTTOM - BALL_RADIUS, pos.y));
                draggedBall.vx = 0; draggedBall.vy = 0; return;
            }
            if (isAiming) {
                aimCurrentPos = pos;
                let dist = Math.hypot(aimStartPos.x - pos.x, aimStartPos.y - pos.y);
                currentShotPower = Math.min(100, Math.round((dist / 140) * 100));
                document.getElementById('billiards-power-text').innerText = `القوة: ${currentShotPower}%`;
            }
        }

        function handlePointerUp(e) {
            if (draggedBall) { draggedBall = null; return; }
            if (!isAiming || !poolCueBall) return;
            isAiming = false;

            let pullX = aimStartPos.x - aimCurrentPos.x;
            let pullY = aimStartPos.y - aimCurrentPos.y;
            let dist = Math.hypot(pullX, pullY);

            // تم تعديل معامل الضربة (0.08) لتكون طبيعية وليست صاروخية مثل السابق
            if (dist > 15) {
                let angle = Math.atan2(pullY, pullX);
                let power = Math.min(22, dist * 0.08); 
                
                // تأثير السبين على السرعة
                poolCueBall.vx = Math.cos(angle) * power;
                poolCueBall.vy = Math.sin(angle) * power;
            }
            document.getElementById('billiards-power-text').innerText = `القوة: 0%`;
        }

        poolCanvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        poolCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if(isAiming || draggedBall) { e.preventDefault(); handlePointerMove(e); } }, { passive: false });
        window.addEventListener('touchend', (e) => { if(isAiming || draggedBall) handlePointerUp(e); }, { passive: false });

        /* --- تحكم السبين (Spin UI Logic) --- */
        function toggleSpinModal() {
            document.getElementById('spinModal').classList.toggle('active');
        }

        const spinArea = document.getElementById('spinArea');
        const spinDotMain = document.getElementById('spinDotMain');
        const spinIndicator = document.getElementById('spinIndicator');

        function updateSpinPos(e) {
            const rect = spinArea.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let x = clientX - rect.left - rect.width/2;
            let y = clientY - rect.top - rect.height/2;
            
            // حصر النقطة داخل الدائرة
            const radius = rect.width / 2;
            const dist = Math.hypot(x, y);
            if(dist > radius) {
                x = (x / dist) * radius;
                y = (y / dist) * radius;
            }

            spinX = x / radius;
            spinY = y / radius;

            spinDotMain.style.left = `${50 + (spinX * 50)}%`;
            spinDotMain.style.top = `${50 + (spinY * 50)}%`;
            spinIndicator.style.left = `${50 + (spinX * 35)}%`;
            spinIndicator.style.top = `${50 + (spinY * 35)}%`;
            spinIndicator.style.transform = 'translate(-50%, -50%)';
        }

        spinArea.addEventListener('mousedown', (e) => { updateSpinPos(e); spinArea.addEventListener('mousemove', updateSpinPos); });
        window.addEventListener('mouseup', () => spinArea.removeEventListener('mousemove', updateSpinPos));
        spinArea.addEventListener('touchstart', (e) => { e.preventDefault(); updateSpinPos(e); }, {passive: false});
        spinArea.addEventListener('touchmove', (e) => { e.preventDefault(); updateSpinPos(e); }, {passive: false});

        // تشغيل المحاكي
        initPoolBalls('triangle');
        requestAnimationFrame(poolGameLoop);

    </script>
</body>
</html>
