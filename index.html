<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlatoX - Pro Educational Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Rajdhani:wght@600;700;900&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0a0f; 
            --bg-card: rgba(18, 18, 26, 0.65); 
            --primary: #ffffff; 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-active-glow: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: 'Cairo', sans-serif;
            position: relative; min-height: 100vh; overflow-x: hidden;
        }

        .static-gaming-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -3; pointer-events: none;
            background-color: var(--bg-main);
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .glass-panel { 
            background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 8px 30px 0 rgba(0, 0, 0, 0.35); 
        }

        .fit-btn, .cancel-btn {
            border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 10px 15px; font-family: inherit;
        }
        .fit-btn { background: var(--primary); color: var(--bg-main); font-weight: 900; }
        .fit-btn:hover { box-shadow: 0 0 15px var(--btn-active-glow); }
        .cancel-btn { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--glass-border); }

        .view-section { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; padding: 30px 15px; animation: fadeIn 0.3s ease; }
        .view-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 1.7rem; font-weight: 900; margin-bottom: 25px; text-align: center; }
        .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        /* --- تصميم القائمة الرئيسية --- */
        #sim-hub { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .sim-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 16px; padding: 25px 20px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: 0.3s; }
        .sim-card:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.3); }
        .sim-card i { font-size: 40px; color: var(--primary); width: 45px; text-align: center; }
        .sim-card-info h3 { margin: 0 0 5px 0; font-size: 1.2rem; font-weight: 900; }
        .sim-card-info p { margin: 0; font-size: 12.5px; color: var(--text-muted); }

        /* --- تصميم الروليت --- */
        .roulette-wrapper { width: 100%; max-width: 400px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative;}
        .r-canvas-box { position: relative; margin-bottom: 5px; }
        #rouletteCanvas { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 3px solid #fff; width: 280px; height: 280px; }
        .r-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid #ef4444; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); z-index: 10; }
        .names-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #fff; padding: 12px; border-radius: 8px; font-family: inherit; resize: vertical; min-height: 70px; outline: none; text-align: center; font-weight: bold; }
        .names-input::placeholder { color: rgba(255,255,255,0.4); font-size: 12.5px; font-weight: normal;}
        
        .winner-popup { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(15, 15, 20, 0.98); padding: 25px 20px; border-radius: 16px; border: 2px solid var(--primary); color: #fff; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.9); transition: 0.3s; z-index: 20; width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; pointer-events: none; opacity: 0;}
        .winner-popup.show { transform: translate(-50%, -50%) scale(1); pointer-events: auto; opacity: 1;}
        .winner-name { font-size: 1.8rem; font-weight: 900; color: #fbc531; text-shadow: 0 0 10px rgba(251, 197, 49, 0.5); }
        .winner-btns { display: flex; gap: 10px; width: 100%; }

        /* --- تصميم البلياردو --- */
        .billiards-wrapper { width: 100%; max-width: 500px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; }
        .b-controls { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .b-input-box { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05); padding: 5px 12px; border-radius: 8px; border: 1px solid var(--glass-border); font-size: 13px; font-weight: bold; }
        .b-input-box input { width: 40px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); color: var(--primary); text-align: center; border-radius: 6px; padding: 2px; font-weight: 900; outline: none; font-family: 'Rajdhani', sans-serif; pointer-events: auto;}
        
        .table-area { display: flex; align-items: stretch; gap: 12px; position: relative; width: 100%; justify-content: center;}
        
        #billiardsCanvas {
            width: 270px; height: 510px; border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); background: #000;
        }

        .controls-left { 
            position: absolute; left: 8px; bottom: 25px; 
            display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10;
        }

        .spin-toggle { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 2px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.6); cursor: pointer; display: flex; justify-content: center; align-items: center; position: relative; }
        .spin-dot-indicator { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; position: absolute; }
        
        .spin-modal { display: none; position: absolute; left: 45px; bottom: 250px; background: rgba(20,20,25,0.98); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.9); z-index: 20; flex-direction: column; align-items: center; gap: 12px; }
        .spin-modal.active { display: flex; animation: fadeIn 0.2s; }
        .spin-presets { display: flex; gap: 8px; justify-content: center; }
        .spin-preset-ball { width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #dcdde1); position: relative; cursor: pointer; border: 1px solid #555; }
        .spin-preset-dot { position: absolute; width: 8px; height: 8px; border: 2px solid #ef4444; border-radius: 50%; transform: translate(-50%, -50%); }
        .spin-area { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #ddd); border: 2px solid #555; position: relative; cursor: crosshair; touch-action: none; margin-top: 5px; }
        .spin-crosshair { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,0,0,0.2); pointer-events: none; }
        .spin-crosshair.vert { top: 0; left: 50%; width: 1px; height: 100%; }
        .spin-dot-main { position: absolute; width: 14px; height: 14px; background: #ef4444; border-radius: 50%; border: 2px solid #fff; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* شريط القوة (Power Bar) */
        .power-bar-wrapper {
            width: 26px; height: 230px; border-radius: 13px; border: 2px solid #111;
            background: linear-gradient(to top, #ff3333 0%, #ff9933 30%, #ffcc00 60%, #99cc33 100%);
            position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5); 
            touch-action: none; cursor: grab; 
        }
        .power-bar-wrapper:active { cursor: grabbing; }
        .power-lines {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background: repeating-linear-gradient(to bottom, transparent, transparent 19.5%, rgba(0,0,0,0.8) 20%);
            pointer-events: none; z-index: 2;
        }
        .power-cue {
            position: absolute; left: 50%; transform: translateX(-50%); top: -5px; 
            width: 7px; height: 240px; border-radius: 3.5px; pointer-events: none; z-index: 3;
            background: linear-gradient(to right, #a07855, #f5f6fa, #a07855);
            border-bottom: 6px solid #222; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="static-gaming-bg"></div>

    <div id="view-hub" class="view-section active">
        <h2 class="section-title">مركز المحاكيات التعليمي</h2>
        <div id="sim-hub">
            <div class="sim-card glass-panel" onclick="openSim('roulette')">
                <i class="fa-solid fa-dharmachakra"></i>
                <div class="sim-card-info">
                    <h3>روليت الأسماء</h3>
                    <p>عجلة حظ لتدوير واختيار الأسماء بشكل عشوائي تماماً.</p>
                </div>
            </div>
            <div class="sim-card glass-panel" onclick="openSim('billiards')">
                <i class="fa-solid fa-bowling-ball"></i>
                <div class="sim-card-info">
                    <h3>محاكي البلياردو</h3>
                    <p>تدريب على وزنية ومسار كرات 8-Ball مع خط توجيه كامل.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- الروليت -->
    <div id="view-roulette" class="view-section">
        <div class="top-bar">
            <h2 class="section-title" style="margin: 0;">الروليت</h2>
            <button class="cancel-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        </div>
        <div class="glass-panel roulette-wrapper">
            <div class="r-canvas-box">
                <div class="r-pointer"></div>
                <canvas id="rouletteCanvas" width="280" height="280"></canvas>
                <div id="winnerPopup" class="winner-popup">
                    <span>🎉 الفائز هو 🎉</span>
                    <div class="winner-name" id="winnerNameStr">الاسم</div>
                    <div class="winner-btns">
                        <button class="fit-btn" style="flex: 1; font-size: 12px;" onclick="closeWinnerPopup()">استمرار</button>
                        <button class="cancel-btn" style="flex: 1; color: #ef4444; font-size: 12px;" onclick="removeWinner()">إزالة الفائز</button>
                    </div>
                </div>
            </div>
            <button class="fit-btn" style="width: 100%; height: 42px;" onclick="spinRoulette()"><i class="fa-solid fa-rotate-right"></i> فر العجلة</button>
            <textarea id="rouletteNames" class="names-input" placeholder="أدخل الأسماء هنا، افصل بينها بفاصلة (مثال: YYY, YYY, YYY)"></textarea>
            <div style="width: 100%; display: flex; gap: 8px;">
                <button class="cancel-btn" style="flex: 1;" onclick="updateRouletteWheel()"><i class="fa-solid fa-check"></i> تحديث</button>
                <button class="cancel-btn" style="flex: 1; color: #ef4444;" onclick="resetRouletteNames()"><i class="fa-solid fa-rotate-left"></i> إعادة تعيين</button>
            </div>
        </div>
    </div>

    <!-- البلياردو -->
    <div id="view-billiards" class="view-section">
        <div class="top-bar">
            <h2 class="section-title" style="margin: 0;">البلياردو</h2>
            <button class="cancel-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        </div>
        <div class="glass-panel billiards-wrapper">
            
            <div class="b-controls">
                <div class="b-input-box">
                    <label>الكرات:</label>
                    <input type="number" id="ballCountInput" min="1" max="15" value="15" onchange="initPoolBalls('triangle')">
                </div>
                <button type="button" class="fit-btn" onclick="initPoolBalls('triangle')" style="flex: 1;"><i class="fa-solid fa-play"></i> ترتيب</button>
                <button type="button" class="cancel-btn" onclick="resetBilliards()" style="color: #ef4444;"><i class="fa-solid fa-rotate-left"></i> إعادة تعيين</button>
            </div>

            <div class="table-area">
                <canvas id="billiardsCanvas" width="270" height="510"></canvas>
                
                <div class="controls-left">
                    <div class="spin-toggle" onclick="toggleSpinModal()" title="إعدادات السبين">
                        <div class="spin-dot-indicator" id="spinIndicator"></div>
                    </div>
                    <div class="power-bar-wrapper" id="powerBar">
                        <div class="power-lines"></div>
                        <div class="power-cue" id="powerCue"></div>
                    </div>
                </div>

                <div class="spin-modal" id="spinModal">
                    <span style="color: #fff; font-size: 13px; font-weight: 900; letter-spacing: 1px;">PRESET</span>
                    <div class="spin-presets">
                        <div class="spin-preset-ball" onclick="setSpin(-0.6, 0)"><div class="spin-preset-dot" style="top: 50%; left: 20%;"></div></div>
                        <div class="spin-preset-ball" onclick="setSpin(-0.3, -0.6)"><div class="spin-preset-dot" style="top: 20%; left: 35%;"></div></div>
                        <div class="spin-preset-ball" onclick="setSpin(0, 0)"><div class="spin-preset-dot" style="top: 50%; left: 50%;"></div></div>
                        <div class="spin-preset-ball" onclick="setSpin(0.3, 0.6)"><div class="spin-preset-dot" style="top: 80%; left: 65%;"></div></div>
                        <div class="spin-preset-ball" onclick="setSpin(0.6, 0)"><div class="spin-preset-dot" style="top: 50%; left: 80%;"></div></div>
                    </div>
                    <div class="spin-area" id="spinArea">
                        <div class="spin-crosshair"></div>
                        <div class="spin-crosshair vert"></div>
                        <div class="spin-dot-main" id="spinDotMain"></div>
                    </div>
                    <button class="cancel-btn" onclick="toggleSpinModal()" style="width: 100%; padding: 6px;">إغلاق</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        function openSim(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            if(viewId === 'roulette') drawRouletteWheel();
            if(viewId === 'billiards') drawPoolTable();
            window.scrollTo(0,0);
        }

        /* =========================================================================
           1. محاكي الروليت
           ========================================================================= */
        const rCanvas = document.getElementById("rouletteCanvas");
        const rCtx = rCanvas.getContext("2d");
        const winnerPopup = document.getElementById("winnerPopup");
        
        let rNames = ["YYY", "YYY", "YYY"];
        let rColors = ['#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471', '#34495E', '#16A085', '#E67E22'];
        let startAngle = 0; let arc = Math.PI * 2 / 3;
        let spinVelocity = 0; let isSpinning = false; let lastWinnerIndex = -1;
        
        document.getElementById('rouletteNames').value = rNames.join(', ');

        function updateRouletteWheel() {
            const text = document.getElementById('rouletteNames').value;
            rNames = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            if(rNames.length === 0) rNames = [];
            arc = rNames.length > 0 ? (Math.PI * 2 / rNames.length) : 0;
            winnerPopup.classList.remove('show');
            drawRouletteWheel();
        }

        function resetRouletteNames() { 
            document.getElementById('rouletteNames').value = 'YYY, YYY, YYY'; 
            updateRouletteWheel(); 
        }

        function drawRouletteWheel() {
            rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
            let outsideRadius = 135; let textRadius = 85; let insideRadius = 25;
            const cx = rCanvas.width / 2; const cy = rCanvas.height / 2;

            if (rNames.length === 0) {
                rCtx.beginPath(); rCtx.arc(cx, cy, outsideRadius, 0, Math.PI*2);
                rCtx.fillStyle = "rgba(255,255,255,0.05)"; rCtx.fill();
                return;
            }

            for(let i = 0; i < rNames.length; i++) {
                let angle = startAngle + i * arc;
                rCtx.fillStyle = rColors[i % rColors.length];
                rCtx.beginPath(); rCtx.arc(cx, cy, outsideRadius, angle, angle + arc, false);
                rCtx.arc(cx, cy, insideRadius, angle + arc, angle, true); rCtx.fill();
                rCtx.save(); rCtx.fillStyle = "#ffffff"; rCtx.shadowBlur = 2; rCtx.shadowColor = "rgba(0,0,0,0.8)";
                rCtx.translate(cx + Math.cos(angle + arc / 2) * textRadius, cy + Math.sin(angle + arc / 2) * textRadius);
                rCtx.rotate(angle + arc / 2); rCtx.textAlign = "right"; rCtx.font = "bold 15px Cairo";
                rCtx.fillText(rNames[i], 30, 5); rCtx.restore();
            }
            rCtx.beginPath(); rCtx.arc(cx, cy, insideRadius, 0, Math.PI * 2); rCtx.fillStyle = "#111"; rCtx.fill();
        }

        function spinRoulette() {
            if(rNames.length === 0 || isSpinning) return;
            winnerPopup.classList.remove('show');
            spinVelocity = 0.3 + Math.random() * 0.4; 
            isSpinning = true; animateRoulette();
        }

        function animateRoulette() {
            if (spinVelocity > 0.001) {
                startAngle += spinVelocity; spinVelocity *= 0.98; 
                drawRouletteWheel(); requestAnimationFrame(animateRoulette);
            } else {
                spinVelocity = 0; isSpinning = false; showWinner();
            }
        }

        function showWinner() {
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            if (index < 0) index = rNames.length - (Math.abs(index) % rNames.length);
            if (index === rNames.length) index = 0;
            lastWinnerIndex = index;
            document.getElementById("winnerNameStr").innerText = rNames[index];
            winnerPopup.classList.add('show');
        }

        function closeWinnerPopup() { winnerPopup.classList.remove('show'); }
        function removeWinner() {
            if (lastWinnerIndex > -1 && lastWinnerIndex < rNames.length) {
                rNames.splice(lastWinnerIndex, 1);
                document.getElementById('rouletteNames').value = rNames.join(', ');
                updateRouletteWheel();
            }
            closeWinnerPopup();
        }
        drawRouletteWheel();


        /* =========================================================================
           2. محاكي البلياردو الاحترافي 8-Ball
           ========================================================================= */
        const poolCanvas = document.getElementById('billiardsCanvas');
        const poolCtx = poolCanvas.getContext('2d');

        const tableImg = new Image();
        tableImg.src = 'IMG_7620.jpeg'; 
        
        const TABLE_WIDTH = 270; const TABLE_HEIGHT = 510;
        const CUSHION = 22; 
        const PLAY_LEFT = CUSHION; const PLAY_RIGHT = TABLE_WIDTH - CUSHION;
        const PLAY_TOP = CUSHION; const PLAY_BOTTOM = TABLE_HEIGHT - CUSHION;
        
        const BALL_RADIUS = 7.5;  
        const POCKET_RADIUS = 15.5; 
        
        // تعديل مهم: تم تقليل الاحتكاك الطبيعي لتصبح الكرات واقعية 100% ولا تستمر بالانزلاق
        const FRICTION = 0.978; 

        // تحديد مساحة السقوط الفعلية للحفرة (أوسع بقليل من الرسم لتسهيل الدخول بواقعية)
        const POCKET_DROP_RADIUS = 20;

        const POCKETS = [
            { x: PLAY_LEFT - 2, y: PLAY_TOP - 2 }, { x: PLAY_RIGHT + 2, y: PLAY_TOP - 2 },
            { x: PLAY_LEFT - 5, y: TABLE_HEIGHT / 2 }, { x: PLAY_RIGHT + 5, y: TABLE_HEIGHT / 2 },
            { x: PLAY_LEFT - 2, y: PLAY_BOTTOM + 2 }, { x: PLAY_RIGHT + 2, y: PLAY_BOTTOM + 2 }
        ];

        const RACK_ORDER = [
            { c: '#F9CA24', n: 1, type: 'solid' }, 
            { c: '#D63031', n: 3, type: 'solid' }, { c: '#E17055', n: 5, type: 'solid' }, 
            { c: '#0984E3', n: 2, type: 'solid' }, { c: '#222222', n: 8, type: 'solid' }, { c: '#6C5CE7', n: 4, type: 'solid' }, 
            { c: '#B53471', n: 7, type: 'solid' }, { c: '#00B894', n: 6, type: 'solid' }, { c: '#F9CA24', n: 9, type: 'stripe' }, { c: '#0984E3', n: 10, type: 'stripe' }, 
            { c: '#D63031', n: 11, type: 'stripe' }, { c: '#6C5CE7', n: 12, type: 'stripe' }, { c: '#E17055', n: 13, type: 'stripe' }, { c: '#00B894', n: 14, type: 'stripe' }, { c: '#B53471', n: 15, type: 'stripe' } 
        ];

        let poolBalls = []; let poolCueBall = null;
        let aimAngle = -Math.PI / 2; 
        let spinX = 0; let spinY = 0;
        let activeSpinX = 0; let activeSpinY = 0; // لضمان تطبيق السبين أثناء الضربة فقط
        let draggedBall = null; 

        class PoolBall {
            constructor(x, y, data, isCue = false) {
                this.x = x; this.y = y; this.vx = 0; this.vy = 0;
                this.radius = BALL_RADIUS; 
                this.color = data ? data.c : '#ffffff';
                this.number = data ? data.n : 0; 
                this.type = data ? data.type : 'solid';
                this.isCue = isCue; this.inPocket = false;
            }
            draw() {
                if (this.inPocket) return;
                poolCtx.save(); poolCtx.translate(this.x, this.y);
                
                poolCtx.beginPath(); poolCtx.arc(1, 1.5, this.radius, 0, Math.PI * 2);
                poolCtx.fillStyle = 'rgba(0, 0, 0, 0.5)'; poolCtx.fill();

                if (this.type === 'stripe' && !this.isCue) {
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    poolCtx.fillStyle = '#ffffff'; poolCtx.fill();
                    poolCtx.save();
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius, 0, Math.PI * 2); poolCtx.clip();
                    poolCtx.fillStyle = this.color;
                    poolCtx.fillRect(-this.radius, -this.radius * 0.45, this.radius * 2, this.radius * 0.9);
                    poolCtx.restore();
                    const grad = poolCtx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, 1, 0, 0, this.radius);
                    grad.addColorStop(0, 'rgba(255,255,255,0.7)'); grad.addColorStop(0.5, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.4)');
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    poolCtx.fillStyle = grad; poolCtx.fill();
                } else {
                    const grad = poolCtx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, 1, 0, 0, this.radius);
                    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, this.color); grad.addColorStop(1, '#111');
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    poolCtx.fillStyle = grad; poolCtx.fill();
                }

                if (!this.isCue && this.number > 0) {
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius * 0.55, 0, Math.PI * 2);
                    poolCtx.fillStyle = '#fff'; poolCtx.fill();
                    poolCtx.fillStyle = '#000'; poolCtx.font = 'bold 7px Arial';
                    poolCtx.textAlign = 'center'; poolCtx.textBaseline = 'middle';
                    poolCtx.fillText(this.number, 0, 0.5);
                }

                if (this.isCue && (spinX !== 0 || spinY !== 0)) {
                    poolCtx.beginPath(); poolCtx.arc(spinX * this.radius * 0.6, spinY * this.radius * 0.6, 1.5, 0, Math.PI * 2);
                    poolCtx.fillStyle = '#ef4444'; poolCtx.fill();
                }
                poolCtx.restore();
            }
        }

        function initPoolBalls(mode = 'triangle') {
            poolBalls = [];
            poolCueBall = new PoolBall(TABLE_WIDTH / 2, TABLE_HEIGHT * 0.75, null, true);
            poolBalls.push(poolCueBall);
            aimAngle = -Math.PI / 2;

            let count = parseInt(document.getElementById('ballCountInput').value) || 15;
            count = Math.min(15, Math.max(1, count));

            if (mode === 'triangle') {
                const apexX = TABLE_WIDTH / 2;
                const apexY = PLAY_TOP + 120;
                let bIdx = 0;
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col <= row; col++) {
                        if (bIdx >= count) break;
                        let bx = apexX + (col * BALL_RADIUS * 2.05) - (row * BALL_RADIUS * 1.025);
                        let by = apexY - (row * BALL_RADIUS * 1.75);
                        poolBalls.push(new PoolBall(bx, by, RACK_ORDER[bIdx]));
                        bIdx++;
                    }
                }
            }
        }

        function resetBilliards() {
            setSpin(0, 0); 
            initPoolBalls('triangle'); 
        }

        function getAimPrediction(startPos, angle, ignoreBall1 = null, ignoreBall2 = null) {
            let dx = Math.cos(angle), dy = Math.sin(angle);
            let closestT = Infinity, hitType = 'none', hitTarget = null;
            
            let tx = dx > 0 ? (PLAY_RIGHT - BALL_RADIUS - startPos.x) / dx : dx < 0 ? (PLAY_LEFT + BALL_RADIUS - startPos.x) / dx : Infinity;
            let ty = dy > 0 ? (PLAY_BOTTOM - BALL_RADIUS - startPos.y) / dy : dy < 0 ? (PLAY_TOP + BALL_RADIUS - startPos.y) / dy : Infinity;
            
            let wallNormX = 0, wallNormY = 0;
            if (tx > 0 && tx < closestT) { closestT = tx; hitType = 'wall'; wallNormX = dx > 0 ? -1 : 1; wallNormY = 0; }
            if (ty > 0 && ty < closestT) { closestT = ty; hitType = 'wall'; wallNormX = 0; wallNormY = dy > 0 ? -1 : 1; }

            for (let b of poolBalls) {
                if (b === ignoreBall1 || b === ignoreBall2 || b.inPocket) continue;
                let vX = startPos.x - b.x, vY = startPos.y - b.y;
                let b_coef = 2 * (vX * dx + vY * dy);
                let c_coef = vX * vX + vY * vY - (BALL_RADIUS*2)*(BALL_RADIUS*2);
                let disc = b_coef * b_coef - 4 * c_coef;
                if (disc >= 0) {
                    let t = (-b_coef - Math.sqrt(disc)) / 2;
                    if (t > 0.1 && t < closestT) { closestT = t; hitType = 'ball'; hitTarget = b; }
                }
            }
            return { t: closestT, type: hitType, target: hitTarget, dx, dy, nx: wallNormX, ny: wallNormY };
        }

        function drawPoolTable() {
            poolCtx.clearRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            
            if(tableImg.complete && tableImg.naturalHeight !== 0) {
                poolCtx.drawImage(tableImg, 0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            } else {
                poolCtx.fillStyle = '#6e3c1d'; poolCtx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
                poolCtx.fillStyle = '#429e53'; poolCtx.fillRect(PLAY_LEFT, PLAY_TOP, PLAY_RIGHT - PLAY_LEFT, PLAY_BOTTOM - PLAY_TOP);
                poolCtx.strokeStyle = 'rgba(255,255,255,0.3)'; poolCtx.lineWidth = 1;
                poolCtx.beginPath(); poolCtx.moveTo(PLAY_LEFT, TABLE_HEIGHT * 0.75); poolCtx.lineTo(PLAY_RIGHT, TABLE_HEIGHT * 0.75); poolCtx.stroke();
                POCKETS.forEach(p => { poolCtx.beginPath(); poolCtx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI*2); poolCtx.fillStyle = '#050505'; poolCtx.fill(); });
            }

            poolBalls.forEach(b => b.draw());

            if (poolCueBall && !poolCueBall.inPocket && !draggedBall) {
                let isMoving = poolBalls.some(b => !b.inPocket && (Math.abs(b.vx) > 0.05 || Math.abs(b.vy) > 0.05));
                if (!isMoving) {
                    let pred = getAimPrediction(poolCueBall, aimAngle, poolCueBall);
                    let ghostX = poolCueBall.x + pred.dx * pred.t;
                    let ghostY = poolCueBall.y + pred.dy * pred.t;

                    poolCtx.beginPath(); poolCtx.moveTo(poolCueBall.x, poolCueBall.y); poolCtx.lineTo(ghostX, ghostY);
                    poolCtx.strokeStyle = 'rgba(255,255,255,0.9)'; poolCtx.lineWidth = 1.5; poolCtx.stroke();

                    poolCtx.beginPath(); poolCtx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI*2);
                    poolCtx.strokeStyle = 'rgba(255,255,255,0.7)'; poolCtx.lineWidth = 1.2; poolCtx.stroke();

                    if (pred.type === 'ball') {
                        let nx = pred.target.x - ghostX, ny = pred.target.y - ghostY;
                        let nLen = Math.hypot(nx, ny); nx /= nLen; ny /= nLen;
                        
                        let targetAngle = Math.atan2(ny, nx);
                        let redPred = getAimPrediction(pred.target, targetAngle, pred.target, poolCueBall); 
                        let endRedX = pred.target.x + Math.cos(targetAngle) * redPred.t;
                        let endRedY = pred.target.y + Math.sin(targetAngle) * redPred.t;

                        poolCtx.beginPath(); poolCtx.moveTo(pred.target.x, pred.target.y);
                        poolCtx.lineTo(endRedX, endRedY);
                        poolCtx.strokeStyle = '#ff3333'; poolCtx.lineWidth = 2.5; poolCtx.stroke();

                        if (redPred.type === 'wall') {
                            let rrx = redPred.dx, rry = redPred.dy;
                            if (redPred.nx !== 0) rrx = -rrx;
                            if (redPred.ny !== 0) rry = -rry;
                            poolCtx.beginPath(); poolCtx.moveTo(endRedX, endRedY);
                            poolCtx.lineTo(endRedX + rrx * 50, endRedY + rry * 50);
                            poolCtx.strokeStyle = '#ff3333'; poolCtx.lineWidth = 1.5; poolCtx.setLineDash([4, 4]); poolCtx.stroke();
                            poolCtx.setLineDash([]);
                        }

                        let tx = -ny, ty = nx;
                        if (pred.dx * tx + pred.dy * ty < 0) { tx = -tx; ty = -ty; }
                        poolCtx.beginPath(); poolCtx.moveTo(ghostX, ghostY); poolCtx.lineTo(ghostX + tx * 35, ghostY + ty * 35);
                        poolCtx.strokeStyle = 'rgba(255,255,255,0.8)'; poolCtx.lineWidth = 1.5; poolCtx.stroke();
                    
                    } else if (pred.type === 'wall') {
                        let rx = pred.dx, ry = pred.dy;
                        if (pred.nx !== 0) rx = -rx;
                        if (pred.ny !== 0) ry = -ry;
                        poolCtx.beginPath(); poolCtx.moveTo(ghostX, ghostY);
                        poolCtx.lineTo(ghostX + rx * 80, ghostY + ry * 80);
                        poolCtx.strokeStyle = '#ff3333'; poolCtx.lineWidth = 1.8; poolCtx.setLineDash([5, 5]); poolCtx.stroke();
                        poolCtx.setLineDash([]);
                    }
                }
            }
        }

        // Sub-stepping مع فيزياء السبين الحقيقية
        function poolGameLoop() {
            const SUB_STEPS = 5; 
            for(let step=0; step<SUB_STEPS; step++) {
                poolBalls.forEach(b => {
                    if(!b.inPocket) {
                        b.x += b.vx / SUB_STEPS; b.y += b.vy / SUB_STEPS;
                        
                        if (b.x - b.radius < PLAY_LEFT) { 
                            b.x = PLAY_LEFT + b.radius; b.vx = -b.vx * 0.85; 
                            if(b.isCue) { b.vy -= activeSpinX * 1.5; activeSpinX *= 0.5; } 
                        } 
                        else if (b.x + b.radius > PLAY_RIGHT) { 
                            b.x = PLAY_RIGHT - b.radius; b.vx = -b.vx * 0.85; 
                            if(b.isCue) { b.vy += activeSpinX * 1.5; activeSpinX *= 0.5; } 
                        }
                        if (b.y - b.radius < PLAY_TOP) { 
                            b.y = PLAY_TOP + b.radius; b.vy = -b.vy * 0.85; 
                            if(b.isCue) { b.vx += activeSpinX * 1.5; activeSpinX *= 0.5; } 
                        } 
                        else if (b.y + b.radius > PLAY_BOTTOM) { 
                            b.y = PLAY_BOTTOM - b.radius; b.vy = -b.vy * 0.85; 
                            if(b.isCue) { b.vx -= activeSpinX * 1.5; activeSpinX *= 0.5; } 
                        }
                    }
                });

                for(let i=0; i<poolBalls.length; i++) {
                    for(let j=i+1; j<poolBalls.length; j++) {
                        let b1 = poolBalls[i], b2 = poolBalls[j];
                        if(b1.inPocket || b2.inPocket) continue;
                        let dx = b2.x - b1.x, dy = b2.y - b1.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist < BALL_RADIUS * 2) {
                            let overlap = (BALL_RADIUS * 2) - dist;
                            let nx = dx / dist, ny = dy / dist;
                            b1.x -= nx * (overlap/2); b1.y -= ny * (overlap/2);
                            b2.x += nx * (overlap/2); b2.y += ny * (overlap/2);
                            
                            let kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
                            let p = (nx * kx + ny * ky);
                            
                            if (p > 0) {
                                b1.vx -= p * nx; b1.vy -= p * ny;
                                b2.vx += p * nx; b2.vy += p * ny;

                                // تأثير السبين (Draw/Follow) المباشر والحقيقي عند الاصطدام بالكرات
                                if (b1.isCue) {
                                    b1.vx += Math.cos(aimAngle) * (-activeSpinY) * 2.0; 
                                    b1.vy += Math.sin(aimAngle) * (-activeSpinY) * 2.0;
                                    activeSpinY *= 0.4; activeSpinX *= 0.4;
                                } else if (b2.isCue) {
                                    b2.vx += Math.cos(aimAngle) * (-activeSpinY) * 2.0;
                                    b2.vy += Math.sin(aimAngle) * (-activeSpinY) * 2.0;
                                    activeSpinY *= 0.4; activeSpinX *= 0.4;
                                }
                            }
                        }
                    }
                }
            }

            poolBalls.forEach(b => {
                if(!b.inPocket) {
                    b.vx *= FRICTION; b.vy *= FRICTION;
                    if (Math.hypot(b.vx, b.vy) < 0.05) { b.vx = 0; b.vy = 0; }
                    
                    for (let p of POCKETS) {
                        // الحفر أصبحت واسعة الاستيعاب كما طلبت لسقوط الكرات بنعومة
                        if (Math.hypot(b.x - p.x, b.y - p.y) < POCKET_DROP_RADIUS) {
                            b.inPocket = true; b.vx = 0; b.vy = 0;
                            if (b.isCue) setTimeout(() => { b.inPocket = false; b.x = TABLE_WIDTH/2; b.y = TABLE_HEIGHT*0.75; }, 1000);
                            break;
                        }
                    }
                }
            });
            drawPoolTable();
            requestAnimationFrame(poolGameLoop);
        }

        function getCanvasCoordinates(e) {
            const rect = poolCanvas.getBoundingClientRect();
            const scaleX = TABLE_WIDTH / rect.width;
            const scaleY = TABLE_HEIGHT / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        let lastTouchX = 0; let isAimingDrag = false;

        function handlePointerDownTable(e) {
            const pos = getCanvasCoordinates(e);
            draggedBall = poolBalls.find(b => !b.inPocket && Math.hypot(b.x - pos.x, b.y - pos.y) < BALL_RADIUS * 2);
            if (!draggedBall) {
                isAimingDrag = true;
                if(poolCueBall && !poolCueBall.inPocket) {
                    aimAngle = Math.atan2(pos.y - poolCueBall.y, pos.x - poolCueBall.x);
                }
                lastTouchX = e.touches ? e.touches[0].clientX : e.clientX;
            }
        }

        function handlePointerMoveTable(e) {
            if (draggedBall) {
                const pos = getCanvasCoordinates(e);
                draggedBall.x = Math.max(PLAY_LEFT + BALL_RADIUS, Math.min(PLAY_RIGHT - BALL_RADIUS, pos.x));
                draggedBall.y = Math.max(PLAY_TOP + BALL_RADIUS, Math.min(PLAY_BOTTOM - BALL_RADIUS, pos.y));
                draggedBall.vx = 0; draggedBall.vy = 0;
            } else if (isAimingDrag) {
                const pos = getCanvasCoordinates(e);
                if (poolCueBall && !poolCueBall.inPocket) {
                    aimAngle = Math.atan2(pos.y - poolCueBall.y, pos.x - poolCueBall.x);
                }
            }
        }

        function handlePointerUpTable() { draggedBall = null; isAimingDrag = false; }

        poolCanvas.addEventListener('mousedown', handlePointerDownTable);
        window.addEventListener('mousemove', handlePointerMoveTable);
        window.addEventListener('mouseup', handlePointerUpTable);
        poolCanvas.addEventListener('touchstart', e => { e.preventDefault(); handlePointerDownTable(e); }, { passive: false });
        window.addEventListener('touchmove', e => { if (draggedBall || isAimingDrag) { e.preventDefault(); handlePointerMoveTable(e); } }, { passive: false });
        window.addEventListener('touchend', e => { if (draggedBall || isAimingDrag) handlePointerUpTable(); }, { passive: false });

        const powerBar = document.getElementById('powerBar');
        const powerCue = document.getElementById('powerCue');
        let powerDragging = false; let powerStartY = 0; let powerValue = 0;

        function handlePowerDown(yPos) { powerDragging = true; powerStartY = yPos; }

        function updatePowerUI(yPos) {
            let deltaY = yPos - powerStartY;
            if (deltaY < 0) deltaY = 0; 
            const maxPull = powerBar.getBoundingClientRect().height - 15; 
            powerValue = Math.min(1, deltaY / maxPull);
            powerCue.style.top = `${powerValue * maxPull}px`; 
        }

        function shootCueBall() {
            if (!poolCueBall || poolCueBall.inPocket) return;
            let isMoving = poolBalls.some(b => !b.inPocket && (Math.abs(b.vx) > 0.05 || Math.abs(b.vy) > 0.05));
            if (isMoving || powerValue < 0.05) return; 

            // حفظ قيمة السبين المحددة حالياً لتطبيقها على الضربة
            activeSpinX = spinX;
            activeSpinY = spinY;

            let power = powerValue * 22; 
            poolCueBall.vx = Math.cos(aimAngle) * power;
            poolCueBall.vy = Math.sin(aimAngle) * power;
        }

        powerBar.addEventListener('mousedown', e => { handlePowerDown(e.clientY); });
        window.addEventListener('mousemove', e => { if(powerDragging) updatePowerUI(e.clientY); });
        window.addEventListener('mouseup', () => { 
            if(powerDragging) { powerDragging = false; shootCueBall(); powerValue = 0; powerCue.style.top = '-5px'; }
        });
        powerBar.addEventListener('touchstart', e => { e.preventDefault(); handlePowerDown(e.touches[0].clientY); }, { passive: false });
        window.addEventListener('touchmove', e => { if(powerDragging) { e.preventDefault(); updatePowerUI(e.touches[0].clientY); } }, { passive: false });
        window.addEventListener('touchend', () => { 
            if(powerDragging) { powerDragging = false; shootCueBall(); powerValue = 0; powerCue.style.top = '-5px'; }
        });

        /* --- تحكم السبين --- */
        function toggleSpinModal() { document.getElementById('spinModal').classList.toggle('active'); }

        const spinArea = document.getElementById('spinArea');
        const spinDotMain = document.getElementById('spinDotMain');
        const spinIndicator = document.getElementById('spinIndicator');

        function setSpin(x, y) { spinX = x; spinY = y; updateSpinUI(); }

        function updateSpinUI() {
            spinDotMain.style.left = `${50 + (spinX * 50)}%`; spinDotMain.style.top = `${50 + (spinY * 50)}%`;
            spinIndicator.style.left = `${50 + (spinX * 35)}%`; spinIndicator.style.top = `${50 + (spinY * 35)}%`;
            spinIndicator.style.transform = 'translate(-50%, -50%)';
        }

        function handleSpinDrag(e) {
            const rect = spinArea.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let x = clientX - rect.left - rect.width/2; let y = clientY - rect.top - rect.height/2;
            const radius = rect.width / 2; const dist = Math.hypot(x, y);
            if(dist > radius) { x = (x / dist) * radius; y = (y / dist) * radius; }
            spinX = x / radius; spinY = y / radius; updateSpinUI();
        }

        spinArea.addEventListener('mousedown', e => { handleSpinDrag(e); spinArea.addEventListener('mousemove', handleSpinDrag); });
        window.addEventListener('mouseup', () => spinArea.removeEventListener('mousemove', handleSpinDrag));
        spinArea.addEventListener('touchstart', e => { e.preventDefault(); handleSpinDrag(e); }, {passive: false});
        spinArea.addEventListener('touchmove', e => { e.preventDefault(); handleSpinDrag(e); }, {passive: false});

        initPoolBalls('triangle');
        requestAnimationFrame(poolGameLoop);

    </script>
</body>
