<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlatoX - Explore Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Rajdhani:wght@600;700;900&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0a0f; 
            --bg-card: rgba(18, 18, 26, 0.65); 
            --primary: #ffffff; 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-active-glow: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            position: relative;
            padding-bottom: 50px;
        }

        /* خلفية الموقع المطابقة للصورة */
        .static-gaming-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -3; pointer-events: none;
            background-color: var(--bg-main);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .glass-panel { 
            background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 8px 30px 0 rgba(0, 0, 0, 0.35); 
        }

        section { padding: 35px 15px 25px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
        
        .section-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 25px; position: relative; letter-spacing: 0.5px; text-align: center; }
        .section-title::before { content: ''; position: absolute; right: -15px; top: 50%; transform: translateY(-50%); width: 6px; height: 20px; background: var(--primary); border-radius: 3px; box-shadow: 0 0 15px var(--btn-active-glow);}

        .cyber-divider { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 600px; margin: 10px auto; opacity: 0.4; }
        .cyber-divider::before, .cyber-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--text-muted), transparent); }
        .cyber-divider .center-node { width: 15px; height: 3px; background: var(--text-muted); margin: 0 10px; transform: skewX(-45deg); }

        .fit-btn, .cancel-btn {
            border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 8px 15px; font-family: inherit;
        }
        .fit-btn { background: var(--primary); color: var(--bg-main); font-weight: 900; }
        .cancel-btn { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--glass-border); }

        /* تابات التبديل الداخلية */
        .sim-tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .sim-tab { 
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.7); 
            padding: 6px 18px; border-radius: 30px; cursor: pointer; font-weight: 700; font-family: 'Cairo', sans-serif; transition: 0.3s; font-size: 13px;
        }
        .sim-tab.active { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }

        /* حاويات المحاكيات */
        .sim-content { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; }
        .sim-content.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- تصميم الروليت --- */
        .roulette-wrapper { width: 100%; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .r-canvas-box { position: relative; margin-bottom: 5px; }
        #rouletteCanvas { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 3px solid #fff; max-width: 100%; height: auto;}
        .r-pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 25px solid #ef4444; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); z-index: 10;
        }
        .names-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #fff;
            padding: 10px; border-radius: 8px; font-family: inherit; resize: vertical; min-height: 60px; outline: none; text-align: center;
        }
        .names-input:focus { border-color: var(--primary); }
        .winner-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 15, 20, 0.95); padding: 15px 30px; border-radius: 12px;
            border: 2px solid var(--primary); color: #fff; font-size: 1.3rem; font-weight: 900;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: 0.3s; z-index: 20; width: 85%;
        }
        .winner-popup.show { transform: translate(-50%, -50%) scale(1); }

        /* --- تصميم البلياردو --- */
        .billiards-wrapper { width: 100%; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .b-controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; width: 100%; }
        .b-input-box {
            display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px; border-radius: 8px; border: 1px solid var(--glass-border); font-size: 13px; font-weight: bold;
        }
        .b-input-box input {
            width: 40px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
            color: var(--primary); text-align: center; border-radius: 6px; padding: 2px; font-weight: 900; outline: none; font-family: 'Rajdhani', sans-serif;
        }
        .b-canvas-box { width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        #billiardsCanvas {
            width: 100%; max-width: 270px; height: auto; aspect-ratio: 280 / 530; 
            border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 0 15px rgba(0,0,0,0.9);
            touch-action: none; cursor: grab; background: #4a2c11;
        }
        #billiardsCanvas:active { cursor: grabbing; }
        
        .b-status {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 270px; margin-top: 10px; padding: 0 5px; font-size: 12.5px; color: var(--primary); font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="static-gaming-bg"></div>

    <main style="width: 100%; max-width: 800px; margin: 0 auto;">
        
        <!-- قسم تجريبي يمثل الأقسام التي تسبق المحاكي في صفحة استكشف -->
        <section id="dummy-section">
            <h2 class="section-title">ترتيب المجموعات الأكثر إنفاقًا</h2>
            <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">
                (محتوى تجريبي للقسم الذي يسبق المحاكيات لإظهار التناسق)
            </div>
        </section>

        <div class="cyber-divider"><div class="center-node"></div></div>

        <!-- السكشن الرئيسي للمحاكيات (مدمج كجزء من الصفحة) -->
        <section id="simulators-section">
            <h2 class="section-title">محاكي الألعاب | Simulators</h2>
            
            <!-- أزرار التبديل داخل السكشن -->
            <div class="sim-tabs" dir="ltr">
                <button type="button" class="sim-tab active" onclick="switchSimulator('billiards', this)"><i class="fa-solid fa-bowling-ball"></i> بلياردو</button>
                <button type="button" class="sim-tab" onclick="switchSimulator('roulette', this)"><i class="fa-solid fa-dharmachakra"></i> الروليت</button>
            </div>

            <!-- 1. محتوى البلياردو -->
            <div id="sim-billiards" class="sim-content active">
                <div class="glass-panel billiards-wrapper">
                    <p style="text-align: center; color: var(--text-muted); font-size: 12.5px; margin: 0; font-weight: 700; line-height: 1.6;">
                        اسحب الكرة البيضاء للتسديد، أو اسحب أي كرة لتغيير مكانها، مع مسار توجيه احترافي.
                    </p>

                    <div class="b-controls">
                        <div class="b-input-box">
                            <label>الكرات:</label>
                            <input type="number" id="ballCountInput" min="1" max="15" value="15">
                        </div>
                        <button type="button" class="fit-btn" onclick="initPoolBalls('triangle')"><i class="fa-solid fa-play"></i> مثلث</button>
                        <button type="button" class="cancel-btn" onclick="initPoolBalls('clear')" style="color: #ef4444;"><i class="fa-solid fa-trash"></i> مسح</button>
                    </div>

                    <div class="b-canvas-box">
                        <canvas id="billiardsCanvas" width="280" height="530"></canvas>
                        <div class="b-status">
                            <span id="billiards-power-text"><i class="fa-solid fa-bolt"></i> القوة: 0%</span>
                            <span id="billiards-active-balls"><i class="fa-solid fa-circle"></i> الكرات: 15</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. محتوى الروليت -->
            <div id="sim-roulette" class="sim-content">
                <div class="glass-panel roulette-wrapper">
                    <div class="r-canvas-box">
                        <div class="r-pointer"></div>
                        <canvas id="rouletteCanvas" width="260" height="260"></canvas>
                        <div id="winnerPopup" class="winner-popup">الفائز!</div>
                    </div>

                    <button class="fit-btn" style="width: 100%;" onclick="spinRoulette()"><i class="fa-solid fa-rotate-right"></i> فر العجلة</button>
                    
                    <textarea id="rouletteNames" class="names-input">YYY, YYY, YYY</textarea>
                    
                    <div style="width: 100%; display: flex; gap: 8px;">
                        <button class="cancel-btn" style="flex: 1;" onclick="updateRouletteWheel()"><i class="fa-solid fa-check"></i> تحديث</button>
                        <button class="cancel-btn" style="flex: 1; color: #eab308;" onclick="resetRouletteNames()"><i class="fa-solid fa-rotate-left"></i> إعادة</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <script>
        // --- دالة التبديل بين المحاكيات داخل السكشن ---
        function switchSimulator(simId, btnEl) {
            document.querySelectorAll('.sim-content').forEach(el => el.classList.remove('active'));
            document.getElementById('sim-' + simId).classList.add('active');
            
            document.querySelectorAll('.sim-tab').forEach(el => el.classList.remove('active'));
            btnEl.classList.add('active');
            
            if(simId === 'roulette') drawRouletteWheel();
            if(simId === 'billiards') drawPoolTable();
        }

        /* =========================================================================
           1. محاكي الروليت (Roulette Simulator)
           ========================================================================= */
        const rCanvas = document.getElementById("rouletteCanvas");
        const rCtx = rCanvas.getContext("2d");
        const winnerPopup = document.getElementById("winnerPopup");
        
        let rNames = [];
        let rColors = ['#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471', '#34495E', '#16A085', '#E67E22'];
        let startAngle = 0;
        let arc = 0;
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;
        
        function updateRouletteWheel() {
            const text = document.getElementById('rouletteNames').value;
            rNames = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            if(rNames.length === 0) rNames = ["فارغ"];
            arc = Math.PI / (rNames.length / 2);
            winnerPopup.classList.remove('show');
            drawRouletteWheel();
        }

        function resetRouletteNames() {
            document.getElementById('rouletteNames').value = 'YYY, YYY, YYY';
            updateRouletteWheel();
        }

        function drawRouletteWheel() {
            rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
            let outsideRadius = 120;
            let textRadius = 80;
            let insideRadius = 20;
            const cx = rCanvas.width / 2;
            const cy = rCanvas.height / 2;

            for(let i = 0; i < rNames.length; i++) {
                let angle = startAngle + i * arc;
                rCtx.fillStyle = rColors[i % rColors.length];
                
                rCtx.beginPath();
                rCtx.arc(cx, cy, outsideRadius, angle, angle + arc, false);
                rCtx.arc(cx, cy, insideRadius, angle + arc, angle, true);
                rCtx.fill();
                
                rCtx.save();
                rCtx.fillStyle = "#ffffff";
                rCtx.shadowBlur = 2; rCtx.shadowColor = "rgba(0,0,0,0.5)";
                rCtx.translate(cx + Math.cos(angle + arc / 2) * textRadius, cy + Math.sin(angle + arc / 2) * textRadius);
                rCtx.rotate(angle + arc / 2);
                rCtx.textAlign = "right";
                rCtx.font = "bold 14px Cairo";
                rCtx.fillText(rNames[i], 25, 5);
                rCtx.restore();
            }
            rCtx.beginPath(); rCtx.arc(cx, cy, insideRadius, 0, Math.PI * 2); rCtx.fillStyle = "#111"; rCtx.fill();
        }

        function spinRoulette() {
            if(rNames.length <= 1) return;
            winnerPopup.classList.remove('show');
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3 + 4 * 1000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) { stopRotateWheel(); return; }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawRouletteWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            
            winnerPopup.innerHTML = "🎉 " + rNames[index] + " 🎉";
            winnerPopup.classList.add('show');
        }

        function easeOut(t, b, c, d) {
            let ts = (t/=d)*t; let tc = ts*t; return b+c*(tc + -3*ts + 3*t);
        }
        
        updateRouletteWheel();


        /* =========================================================================
           2. محاكي البلياردو (Billiards Simulator - الأبعاد والوزنية المحدثة)
           ========================================================================= */
        const poolCanvas = document.getElementById('billiardsCanvas');
        const poolCtx = poolCanvas.getContext('2d');

        const TABLE_WIDTH = 280;
        const TABLE_HEIGHT = 530;
        const CUSHION = 22; 
        const PLAY_LEFT = CUSHION;
        const PLAY_RIGHT = TABLE_WIDTH - CUSHION;
        const PLAY_TOP = CUSHION;
        const PLAY_BOTTOM = TABLE_HEIGHT - CUSHION;
        const BALL_RADIUS = 9; 
        // تصغير الحفر بناءً على طلبك لتكون مناسبة لحجم الكرات (مثل الصورة)
        const POCKET_RADIUS = 13.5; 
        const FRICTION = 0.985; 

        // تحديد أماكن الحفر بشكل دقيق في الزوايا
        const POCKETS = [
            { x: PLAY_LEFT - 3, y: PLAY_TOP - 3 }, { x: PLAY_RIGHT + 3, y: PLAY_TOP - 3 },
            { x: PLAY_LEFT - 5, y: TABLE_HEIGHT / 2 }, { x: PLAY_RIGHT + 5, y: TABLE_HEIGHT / 2 },
            { x: PLAY_LEFT - 3, y: PLAY_BOTTOM + 3 }, { x: PLAY_RIGHT + 3, y: PLAY_BOTTOM + 3 }
        ];

        const BALL_COLORS = ['#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471', '#2D3436', '#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471'];

        let poolBalls = [];
        let poolCueBall = null;
        let isAiming = false;
        let draggedBall = null;
        let aimStartPos = { x: 0, y: 0 };
        let aimCurrentPos = { x: 0, y: 0 };
        let currentShotPower = 0;

        class PoolBall {
            constructor(x, y, color = '#ffffff', number = 0, isCue = false) {
                this.x = x; this.y = y; this.vx = 0; this.vy = 0;
                this.radius = BALL_RADIUS; this.color = color;
                this.number = number; this.isCue = isCue; this.inPocket = false;
            }
            draw() {
                if (this.inPocket) return;
                poolCtx.save();
                poolCtx.translate(this.x, this.y);
                
                poolCtx.beginPath(); poolCtx.arc(1, 1.5, this.radius, 0, Math.PI * 2);
                poolCtx.fillStyle = 'rgba(0, 0, 0, 0.4)'; poolCtx.fill();

                const grad = poolCtx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, 1, 0, 0, this.radius);
                grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, this.color); grad.addColorStop(1, '#111');
                poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius, 0, Math.PI * 2);
                poolCtx.fillStyle = grad; poolCtx.fill();

                if (!this.isCue && this.number > 0) {
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius * 0.5, 0, Math.PI * 2);
                    poolCtx.fillStyle = '#fff'; poolCtx.fill();
                    poolCtx.fillStyle = '#000'; poolCtx.font = 'bold 8px Rajdhani';
                    poolCtx.textAlign = 'center'; poolCtx.textBaseline = 'middle';
                    poolCtx.fillText(this.number, 0, 0.5);
                }
                poolCtx.restore();
            }
            update() {
                if (this.inPocket) return;
                this.x += this.vx; this.y += this.vy;
                this.vx *= FRICTION; this.vy *= FRICTION;

                if (Math.hypot(this.vx, this.vy) < 0.05) { this.vx = 0; this.vy = 0; }

                if (this.x - this.radius < PLAY_LEFT) { this.x = PLAY_LEFT + this.radius; this.vx = -this.vx; } 
                else if (this.x + this.radius > PLAY_RIGHT) { this.x = PLAY_RIGHT - this.radius; this.vx = -this.vx; }
                if (this.y - this.radius < PLAY_TOP) { this.y = PLAY_TOP + this.radius; this.vy = -this.vy; } 
                else if (this.y + this.radius > PLAY_BOTTOM) { this.y = PLAY_BOTTOM - this.radius; this.vy = -this.vy; }

                for (let p of POCKETS) {
                    if (Math.hypot(this.x - p.x, this.y - p.y) < POCKET_RADIUS - 1) {
                        this.inPocket = true; this.vx = 0; this.vy = 0;
                        if (this.isCue) setTimeout(() => { this.inPocket = false; this.x = TABLE_WIDTH/2; this.y = TABLE_HEIGHT*0.75; }, 1000);
                        updateBilliardsCounters(); break;
                    }
                }
            }
        }

        function initPoolBalls(mode = 'triangle') {
            poolBalls = [];
            poolCueBall = new PoolBall(TABLE_WIDTH / 2, TABLE_HEIGHT * 0.75, '#ffffff', 0, true);
            poolBalls.push(poolCueBall);

            let count = parseInt(document.getElementById('ballCountInput').value) || 15;
            count = Math.min(15, Math.max(1, count));

            if (mode === 'triangle') {
                const apexX = TABLE_WIDTH / 2;
                const apexY = PLAY_TOP + 80;
                let bIdx = 0;
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col <= row; col++) {
                        if (bIdx >= count) break;
                        let bx = apexX + (col * BALL_RADIUS * 2.1) - (row * BALL_RADIUS * 1.05);
                        let by = apexY + (row * BALL_RADIUS * 1.8);
                        poolBalls.push(new PoolBall(bx, by, BALL_COLORS[bIdx % 15], bIdx + 1));
                        bIdx++;
                    }
                }
            }
            updateBilliardsCounters();
        }

        function updateBilliardsCounters() {
            const count = poolBalls.filter(b => !b.isCue && !b.inPocket).length;
            document.getElementById('billiards-active-balls').innerHTML = `<i class="fa-solid fa-circle"></i> الكرات: ${count}`;
        }

        function getAimPrediction(cue, angle) {
            let dx = Math.cos(angle), dy = Math.sin(angle);
            let closestT = Infinity, hitType = 'none', hitTarget = null;
            
            let tx = dx > 0 ? (PLAY_RIGHT - BALL_RADIUS - cue.x) / dx : dx < 0 ? (PLAY_LEFT + BALL_RADIUS - cue.x) / dx : Infinity;
            let ty = dy > 0 ? (PLAY_BOTTOM - BALL_RADIUS - cue.y) / dy : dy < 0 ? (PLAY_TOP + BALL_RADIUS - cue.y) / dy : Infinity;
            if (tx > 0 && tx < closestT) { closestT = tx; hitType = 'wall'; }
            if (ty > 0 && ty < closestT) { closestT = ty; hitType = 'wall'; }

            for (let b of poolBalls) {
                if (b === cue || b.inPocket) continue;
                let vX = cue.x - b.x, vY = cue.y - b.y;
                let b_coef = 2 * (vX * dx + vY * dy);
                let c_coef = vX * vX + vY * vY - (BALL_RADIUS*2)*(BALL_RADIUS*2);
                let disc = b_coef * b_coef - 4 * c_coef;
                if (disc >= 0) {
                    let t = (-b_coef - Math.sqrt(disc)) / 2;
                    if (t > 0 && t < closestT) { closestT = t; hitType = 'ball'; hitTarget = b; }
                }
            }
            return { t: closestT, type: hitType, target: hitTarget, dx, dy };
        }

        function drawPoolTable() {
            poolCtx.clearRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            
            // إطار الخشب
            poolCtx.fillStyle = '#4a2c11'; poolCtx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            
            // القماش الأخضر
            poolCtx.fillStyle = '#439955'; poolCtx.fillRect(PLAY_LEFT, PLAY_TOP, PLAY_RIGHT - PLAY_LEFT, PLAY_BOTTOM - PLAY_TOP);

            // خط D
            poolCtx.strokeStyle = 'rgba(255,255,255,0.2)'; poolCtx.lineWidth = 1.5;
            poolCtx.beginPath(); poolCtx.moveTo(PLAY_LEFT, TABLE_HEIGHT * 0.75); poolCtx.lineTo(PLAY_RIGHT, TABLE_HEIGHT * 0.75); poolCtx.stroke();
            poolCtx.beginPath(); poolCtx.arc(TABLE_WIDTH/2, TABLE_HEIGHT*0.75, 30, Math.PI, 0); poolCtx.stroke();

            // رسم الحفر بناءً على الحجم والمكان الجديد
            POCKETS.forEach(p => {
                poolCtx.beginPath(); poolCtx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI*2);
                poolCtx.fillStyle = '#0a0a0a'; poolCtx.fill();
            });

            poolBalls.forEach(b => b.draw());

            if (isAiming && poolCueBall && !poolCueBall.inPocket && !draggedBall) {
                let pullX = aimStartPos.x - aimCurrentPos.x;
                let pullY = aimStartPos.y - aimCurrentPos.y;
                let dist = Math.hypot(pullX, pullY);

                if (dist > 5) {
                    let angle = Math.atan2(pullY, pullX);
                    let pred = getAimPrediction(poolCueBall, angle);
                    
                    let ghostX = poolCueBall.x + pred.dx * pred.t;
                    let ghostY = poolCueBall.y + pred.dy * pred.t;

                    poolCtx.beginPath(); poolCtx.moveTo(poolCueBall.x, poolCueBall.y); poolCtx.lineTo(ghostX, ghostY);
                    poolCtx.strokeStyle = 'rgba(255,255,255,0.8)'; poolCtx.lineWidth = 1.2; poolCtx.stroke();

                    if (pred.type === 'ball') {
                        poolCtx.beginPath(); poolCtx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI*2);
                        poolCtx.strokeStyle = 'rgba(255,255,255,0.6)'; poolCtx.lineWidth = 1; poolCtx.stroke();

                        let nx = pred.target.x - ghostX, ny = pred.target.y - ghostY;
                        let nLen = Math.hypot(nx, ny); nx /= nLen; ny /= nLen;
                        poolCtx.beginPath(); poolCtx.moveTo(pred.target.x, pred.target.y);
                        poolCtx.lineTo(pred.target.x + nx * 120, pred.target.y + ny * 120);
                        poolCtx.strokeStyle = '#ff3333'; poolCtx.lineWidth = 2; poolCtx.stroke();

                        let tx = -ny, ty = nx;
                        if (pred.dx * tx + pred.dy * ty < 0) { tx = -tx; ty = -ty; }
                        poolCtx.beginPath(); poolCtx.moveTo(ghostX, ghostY); poolCtx.lineTo(ghostX + tx * 35, ghostY + ty * 35);
                        poolCtx.strokeStyle = 'rgba(255,255,255,0.8)'; poolCtx.lineWidth = 1.2; poolCtx.stroke();
                    }
                }
            }
        }

        function poolGameLoop() {
            for(let i=0; i<poolBalls.length; i++) {
                for(let j=i+1; j<poolBalls.length; j++) {
                    let b1 = poolBalls[i], b2 = poolBalls[j];
                    if(b1.inPocket || b2.inPocket) continue;
                    let dx = b2.x - b1.x, dy = b2.y - b1.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < BALL_RADIUS * 2) {
                        let overlap = (BALL_RADIUS * 2) - dist;
                        let nx = dx / dist, ny = dy / dist;
                        b1.x -= nx * (overlap/2); b1.y -= ny * (overlap/2);
                        b2.x += nx * (overlap/2); b2.y += ny * (overlap/2);
                        let kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / 2;
                        b1.vx -= p * nx; b1.vy -= p * ny;
                        b2.vx += p * nx; b2.vy += p * ny;
                    }
                }
            }
            poolBalls.forEach(b => b.update());
            drawPoolTable();
            requestAnimationFrame(poolGameLoop);
        }

        function getCanvasCoordinates(e) {
            const rect = poolCanvas.getBoundingClientRect();
            const scaleX = TABLE_WIDTH / rect.width;
            const scaleY = TABLE_HEIGHT / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function handlePointerDown(e) {
            const pos = getCanvasCoordinates(e);
            draggedBall = poolBalls.find(b => !b.inPocket && Math.hypot(b.x - pos.x, b.y - pos.y) < BALL_RADIUS * 2);
            if (draggedBall) {
                isAiming = false;
            } else if (poolCueBall && !poolCueBall.inPocket) {
                isAiming = true; aimStartPos = pos; aimCurrentPos = pos;
            }
        }

        function handlePointerMove(e) {
            const pos = getCanvasCoordinates(e);
            if (draggedBall) {
                draggedBall.x = Math.max(PLAY_LEFT + BALL_RADIUS, Math.min(PLAY_RIGHT - BALL_RADIUS, pos.x));
                draggedBall.y = Math.max(PLAY_TOP + BALL_RADIUS, Math.min(PLAY_BOTTOM - BALL_RADIUS, pos.y));
                draggedBall.vx = 0; draggedBall.vy = 0; return;
            }
            if (isAiming) {
                aimCurrentPos = pos;
                let dist = Math.hypot(aimStartPos.x - pos.x, aimStartPos.y - pos.y);
                currentShotPower = Math.min(100, Math.round((dist / 140) * 100));
                document.getElementById('billiards-power-text').innerHTML = `<i class="fa-solid fa-bolt"></i> القوة: ${currentShotPower}%`;
            }
        }

        function handlePointerUp(e) {
            if (draggedBall) { draggedBall = null; return; }
            if (!isAiming || !poolCueBall) return;
            isAiming = false;

            let pullX = aimStartPos.x - aimCurrentPos.x;
            let pullY = aimStartPos.y - aimCurrentPos.y;
            let dist = Math.hypot(pullX, pullY);

            // تم التعديل لتكون القوة طبيعية جداً ومعقولة (تقليل معامل الضرب إلى 0.08)
            if (dist > 10) {
                let angle = Math.atan2(pullY, pullX);
                let power = Math.min(24, dist * 0.08);
                poolCueBall.vx = Math.cos(angle) * power;
                poolCueBall.vy = Math.sin(angle) * power;
            }
            document.getElementById('billiards-power-text').innerHTML = `<i class="fa-solid fa-bolt"></i> القوة: 0%`;
        }

        poolCanvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        poolCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if(isAiming || draggedBall) { e.preventDefault(); handlePointerMove(e); } }, { passive: false });
        window.addEventListener('touchend', (e) => { if(isAiming || draggedBall) handlePointerUp(e); }, { passive: false });

        initPoolBalls('triangle');
        requestAnimationFrame(poolGameLoop);

    </script>
</body>
</html>
