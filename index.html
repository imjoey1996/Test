<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlatoX - Smart Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #07070a;
            --bg-card: rgba(20, 20, 28, 0.5);
            --bg-card-sub: rgba(30, 30, 40, 0.4);
            --primary: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #848596;
            --coin-color: #fbc531;
            --pip-color: #9c88ff;
            --success-color: #0be881;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: 'Rajdhani', 'Cairo', sans-serif;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- تأثيرات الخلفية الزجاجية والفقاعات --- */
        .site-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 35px 35px;
        }
        .bg-blobs {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; pointer-events: none;
        }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; animation: float 12s infinite ease-in-out alternate; }
        .blob-1 { width: 350px; height: 350px; background: #9c88ff; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #fbc531; bottom: -100px; right: -50px; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 60px) scale(1.1); }
        }

        /* --- الهيدر --- */
        .app-header {
            width: 100%; max-width: 500px; padding: 20px 24px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .app-brand {
            font-size: 1.8rem; font-weight: 900; letter-spacing: 0.5px; font-family: 'Rajdhani', sans-serif;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); display: flex; align-items: center;
        }
        .app-brand span { color: #fff; text-shadow: 0 0 20px #fff, 0 0 40px rgba(255,255,255,0.8); margin-left: 2px;}
        
        .lang-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: var(--primary); font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px;
            padding: 6px 14px; border-radius: 10px; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .lang-btn:hover { border-color: var(--border-glow); background: rgba(255,255,255,0.1); }

        .main-container { 
            width: 100%; max-width: 460px; padding: 10px 20px 40px 20px; 
            display: flex; flex-direction: column; align-items: center; 
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .section-tag {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 1rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            color: #fff; margin: 10px 0 25px 0; text-align: center; font-family: 'Rajdhani', sans-serif;
        }
        .section-tag::before {
            content: ''; width: 4px; height: 18px; background: #fff;
            border-radius: 4px; box-shadow: 0 0 12px #fff;
        }

        /* --- التصميم الزجاجي الرئيسي --- */
        .platox-card {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 25px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255,255,255,0.02);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: column; gap: 20px;
        }

        /* --- أزرار التبديل --- */
        .currency-switch {
            display: flex; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 16px; padding: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .switch-opt {
            flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 15px;
            border-radius: 12px; cursor: pointer; color: var(--text-muted); transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit;
        }
        .switch-opt.active { background: rgba(255,255,255,0.08); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* --- حقل الإدخال --- */
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 16px; padding: 18px 50px 18px 20px; color: #fff;
            font-size: 26px; font-weight: 900; font-family: 'Rajdhani', sans-serif; 
            outline: none; transition: 0.3s; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        html[dir="rtl"] .input-wrapper input { padding: 18px 20px 18px 50px; text-align: right; }
        .input-wrapper input:focus { border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.6); }
        .input-wrapper input::placeholder { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.2); font-family: 'Cairo', sans-serif; }
        
        .input-wrapper i {
            position: absolute; top: 50%; transform: translateY(-50%);
            right: 20px; font-size: 22px; color: var(--text-muted); transition: 0.3s;
        }
        html[dir="rtl"] .input-wrapper i { right: auto; left: 20px; }
        .input-wrapper input:focus + i { filter: drop-shadow(0 0 8px currentColor); }

        /* --- لوحة العرض الاحترافية (Dashboard Style) --- */
        .dashboard-display {
            background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); 
            border: 1px solid var(--border); border-radius: 18px; padding: 25px 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.2);
            position: relative; overflow: hidden;
        }
        
        /* تأثير الإضاءة العلوية للوحة */
        .dashboard-display::before {
            content: ''; position: absolute; top: 0; left: 10%; width: 80%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .main-result-box {
            text-align: center; margin-bottom: 20px; width: 100%;
            padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .calc-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .calc-value { font-size: 3.8rem; font-weight: 900; line-height: 1; margin: 5px 0; font-family: 'Rajdhani', sans-serif;}
        .calc-currency { font-size: 15px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 2px;}

        /* إحصائيات الذكاء الاصطناعي السفلية */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; width: 100%; gap: 15px;
        }
        .stat-item {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .stat-title { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px;}
        .stat-val { font-size: 18px; font-weight: 900; font-family: 'Rajdhani', sans-serif; color: #fff; }
        
        .val-bonus { color: var(--success-color); text-shadow: 0 0 10px rgba(11, 232, 129, 0.4); }

        .text-coins { color: var(--coin-color); text-shadow: 0 0 25px rgba(251, 197, 49, 0.4); }
        .text-pips { color: var(--pip-color); text-shadow: 0 0 25px rgba(156, 136, 255, 0.4); }
        .text-none { color: rgba(255,255,255,0.1); text-shadow: none; }

    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="site-grid"></div>

    <header class="app-header">
        <div class="app-brand">Plato<span>X</span></div>
        <button class="lang-btn" onclick="toggleLanguage()" id="langSwitch">AR</button>
    </header>

    <main class="main-container">
        
        <div class="section-tag" id="sectionTitle">SMART CALCULATOR</div>

        <div class="platox-card">
            
            <div class="currency-switch">
                <div class="switch-opt active" id="modeCoins" onclick="setMode('coins')">
                    <i class="fa-solid fa-coins" style="color: var(--coin-color);"></i> <span id="tabCoins">Coins</span>
                </div>
                <div class="switch-opt" id="modePips" onclick="setMode('pips')">
                    <i class="fa-solid fa-gem" style="color: var(--pip-color);"></i> <span id="tabPips">Pips</span>
                </div>
            </div>

            <div class="input-wrapper">
                <input type="text" inputmode="numeric" id="calcInput" placeholder="Enter Coins..." oninput="handleInput(event)">
                <i class="fa-solid fa-coins" id="inputIcon" style="color: var(--coin-color);"></i>
            </div>

            <!-- لوحة التحكم الاحترافية -->
            <div class="dashboard-display">
                
                <div class="main-result-box">
                    <div class="calc-label" id="resultTitle">ESTIMATED VALUE</div>
                    <div class="calc-value text-none" id="resultValue">0</div>
                    <div class="calc-currency" id="resultCurrency">PIPS</div>
                </div>

                <!-- إحصائيات الذكاء الاصطناعي -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-title" id="statRateLabel">RATE / PIP</div>
                        <div class="stat-val" id="statRateValue">0 <span style="font-size: 10px; color: var(--text-muted);">Coins</span></div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-title" id="statBonusLabel">VOLUME BONUS</div>
                        <div class="stat-val" id="statBonusValue">0%</div>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <script>
        /* =========================================================================
           إعدادات اللغات والترجمة
           ========================================================================= */
        let currentLang = 'en';
        const i18n = {
            en: {
                langBtn: 'AR',
                dir: 'ltr',
                sectionTitle: 'SMART CALCULATOR',
                tabCoins: 'Coins',
                tabPips: 'Pips',
                placeholderCoins: 'Enter Coins...',
                placeholderPips: 'Enter Pips...',
                resultTitle: 'ESTIMATED VALUE',
                currCoins: 'COINS',
                currPips: 'PIPS',
                rateLabel: 'RATE / PIP',
                bonusLabel: 'VOLUME BONUS',
                coinsLabel: 'Coins'
            },
            ar: {
                langBtn: 'EN',
                dir: 'rtl',
                sectionTitle: 'الحاسبة الذكية',
                tabCoins: 'كوينز',
                tabPips: 'بيبس',
                placeholderCoins: 'أدخل عدد الكوينز...',
                placeholderPips: 'أدخل عدد البيبس...',
                resultTitle: 'القيمة التقديرية العادلة',
                currCoins: 'COINS', // الإبقاء على المصطلحات الانجليزية
                currPips: 'PIPS',
                rateLabel: 'سعر الـ PIP',
                bonusLabel: 'بونص الكمية',
                coinsLabel: 'Coins'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const t = i18n[currentLang];
            
            document.documentElement.setAttribute('dir', t.dir);
            document.documentElement.setAttribute('lang', currentLang);
            
            document.getElementById('langSwitch').innerText = t.langBtn;
            document.getElementById('sectionTitle').innerText = t.sectionTitle;
            document.getElementById('tabCoins').innerText = t.tabCoins;
            document.getElementById('tabPips').innerText = t.tabPips;
            document.getElementById('resultTitle').innerText = t.resultTitle;
            document.getElementById('statRateLabel').innerText = t.rateLabel;
            document.getElementById('statBonusLabel').innerText = t.bonusLabel;
            
            document.getElementById('calcInput').placeholder = (currentMode === 'coins') ? t.placeholderCoins : t.placeholderPips;
            document.getElementById('resultCurrency').innerText = (currentMode === 'coins') ? t.currPips : t.currCoins;
        }

        /* =========================================================================
           منطق الحاسبة (AI Dynamic Pricing & Counters)
           ========================================================================= */
        let currentMode = 'coins'; 
        let animationFrame; // لحفظ الـ ID لعملية الـ Animation وإلغائها عند الكتابة السريعة

        function setMode(mode) {
            currentMode = mode;
            const t = i18n[currentLang];
            
            document.getElementById('modeCoins').classList.toggle('active', mode === 'coins');
            document.getElementById('modePips').classList.toggle('active', mode === 'pips');

            const input = document.getElementById('calcInput');
            const icon = document.getElementById('inputIcon');
            const resultCurr = document.getElementById('resultCurrency');
            
            if (mode === 'coins') {
                input.placeholder = t.placeholderCoins;
                icon.className = 'fa-solid fa-coins';
                icon.style.color = 'var(--coin-color)';
                resultCurr.innerText = t.currPips;
            } else {
                input.placeholder = t.placeholderPips;
                icon.className = 'fa-solid fa-gem';
                icon.style.color = 'var(--pip-color)';
                resultCurr.innerText = t.currCoins;
            }
            
            input.value = ''; 
            calculate();
        }

        const convertArabicNumerals = (str) => {
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        };

        function handleInput(e) {
            let val = e.target.value;
            val = convertArabicNumerals(val);
            val = val.replace(/\D/g, ''); // إبقاء الأرقام فقط
            
            if(val !== '') {
                val = parseInt(val, 10).toLocaleString('en-US');
            }
            
            e.target.value = val;
            calculate();
        }

        // الخوارزمية الذكية لحساب السعر
        // السعر الأساسي للبيبس الواحد هو 550 كوينز. ينخفض مع الكميات الكبيرة حتى يستقر حول 400.
        const MAX_RATE = 550;
        function getDynamicRate(pips) {
            if (pips <= 0) return MAX_RATE;
            return 400 + 150 * Math.exp(-pips / 15);
        }

        // دالة العداد المتحرك (Number Animation)
        function animateValue(obj, start, end, duration, isFloat) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                // Ease out Expo
                const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                
                let currentVal = start + (end - start) * easeProgress;
                
                if(isFloat) {
                    let displayValue = (currentVal % 1 !== 0) ? currentVal.toFixed(1) : Math.round(currentVal).toString();
                    let parts = displayValue.split('.');
                    parts[0] = parseInt(parts[0] || 0).toLocaleString('en-US');
                    obj.innerText = parts.join('.');
                } else {
                    obj.innerText = Math.round(currentVal).toLocaleString('en-US');
                }

                if (progress < 1) {
                    animationFrame = window.requestAnimationFrame(step);
                }
            };
            if(animationFrame) window.cancelAnimationFrame(animationFrame);
            animationFrame = window.requestAnimationFrame(step);
        }

        function calculate() {
            let rawValue = document.getElementById('calcInput').value.replace(/,/g, '');
            let val = parseFloat(rawValue);
            
            const outVal = document.getElementById('resultValue');
            const rateVal = document.getElementById('statRateValue');
            const bonusVal = document.getElementById('statBonusValue');

            if (isNaN(val) || val <= 0) {
                if(animationFrame) window.cancelAnimationFrame(animationFrame);
                outVal.innerText = '0';
                outVal.className = 'calc-value text-none';
                rateVal.innerHTML = `0 <span style="font-size: 10px; color: var(--text-muted);">Coins</span>`;
                bonusVal.innerText = '0%';
                bonusVal.className = 'stat-val';
                return;
            }

            let currentActualRate = 0;
            let targetValue = 0;
            let isResultFloat = false;

            if (currentMode === 'coins') {
                let estimatedPips = val / 450; 
                currentActualRate = getDynamicRate(estimatedPips);
                targetValue = val / currentActualRate;
                isResultFloat = true;
                outVal.className = 'calc-value text-pips';
            } else {
                currentActualRate = getDynamicRate(val);
                targetValue = Math.round(val * currentActualRate);
                isResultFloat = false;
                outVal.className = 'calc-value text-coins';
            }

            // تشغيل الأنيميشن للرقم الكبير (مدة 500 ملي ثانية)
            // نجلب القيمة الحالية لنبدأ منها لتكون الحركة متصلة
            let currentDisplay = parseFloat(outVal.innerText.replace(/,/g, '')) || 0;
            animateValue(outVal, currentDisplay, targetValue, 500, isResultFloat);

            // تحديث الإحصائيات (بدون أنيميشن لأنها أرقام مساعدة)
            rateVal.innerHTML = `${Math.round(currentActualRate).toLocaleString('en-US')} <span style="font-size: 10px; color: var(--text-muted);">Coins</span>`;
            
            // حساب نسبة البونص (الذكاء الاصطناعي يحسب كم قل السعر عن السعر الأساسي 550)
            let bonusPercent = ((MAX_RATE - currentActualRate) / MAX_RATE) * 100;
            
            if (bonusPercent > 2) { // إذا كان التخفيض أكثر من 2% نلونه بالأخضر
                bonusVal.innerText = `+${bonusPercent.toFixed(1)}%`;
                bonusVal.className = 'stat-val val-bonus';
            } else {
                bonusVal.innerText = `${Math.max(0, bonusPercent).toFixed(1)}%`;
                bonusVal.className = 'stat-val';
            }
        }
    </script>
</body>
</html>
