<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlatoX - Smart Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #07070a;
            --bg-card: rgba(20, 20, 28, 0.6);
            --bg-card-sub: rgba(30, 30, 40, 0.4);
            --primary: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #848596;
            --coin-color: #fbc531;
            --pip-color: #9c88ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Rajdhani', 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- تأثيرات الخلفية الزجاجية (Glassmorphism & Grid) --- */
        .site-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 35px 35px;
        }
        .bg-blobs {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; animation: float 12s infinite ease-in-out alternate;
        }
        .blob-1 { width: 350px; height: 350px; background: #9c88ff; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #fbc531; bottom: -100px; right: -50px; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 60px) scale(1.1); }
        }

        /* --- الهيدر العلوي --- */
        .app-header {
            width: 100%; max-width: 500px; padding: 20px 24px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }
        .app-brand {
            font-size: 1.8rem; font-weight: 900; letter-spacing: 0.5px; font-family: 'Rajdhani', sans-serif;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); display: flex; align-items: center;
        }
        .app-brand span { color: #fff; text-shadow: 0 0 20px #fff, 0 0 40px rgba(255,255,255,0.8); margin-left: 2px;}
        
        .lang-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: var(--primary); font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px;
            padding: 6px 14px; border-radius: 10px; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .lang-btn:hover { border-color: var(--border-glow); background: rgba(255,255,255,0.1); }

        /* --- حاوية التطبيق --- */
        .main-container { 
            width: 100%; max-width: 460px; padding: 10px 20px 40px 20px; 
            display: flex; flex-direction: column; align-items: center; 
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ستايل العناوين (مطابق للصورة) --- */
        .section-tag {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 1rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            color: #fff; margin: 10px 0 25px 0; text-align: center; font-family: 'Rajdhani', sans-serif;
        }
        .section-tag::before {
            content: ''; width: 4px; height: 18px; background: #fff;
            border-radius: 4px; box-shadow: 0 0 12px #fff;
        }

        /* --- تصميم الكارد الزجاجي --- */
        .platox-card {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 25px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255,255,255,0.02);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: column; gap: 20px;
        }

        /* --- أزرار التبديل --- */
        .currency-switch {
            display: flex; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 16px; padding: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .switch-opt {
            flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 15px;
            border-radius: 12px; cursor: pointer; color: var(--text-muted); transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit;
        }
        .switch-opt.active { background: rgba(255,255,255,0.08); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* --- حقل الإدخال الاحترافي --- */
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 16px; padding: 18px 50px 18px 20px; color: #fff;
            font-size: 26px; font-weight: 900; font-family: 'Rajdhani', sans-serif; 
            outline: none; transition: 0.3s; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        html[dir="rtl"] .input-wrapper input { padding: 18px 20px 18px 50px; text-align: right; }
        .input-wrapper input:focus { border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.6); }
        .input-wrapper input::placeholder { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.2); font-family: 'Cairo', sans-serif; }
        
        .input-wrapper i {
            position: absolute; top: 50%; transform: translateY(-50%);
            right: 20px; font-size: 22px; color: var(--text-muted); transition: 0.3s;
        }
        html[dir="rtl"] .input-wrapper i { right: auto; left: 20px; }
        .input-wrapper input:focus + i { filter: drop-shadow(0 0 8px currentColor); }

        /* --- مربع النتيجة --- */
        .calc-display {
            background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); 
            border: 1px solid var(--border); border-radius: 18px; padding: 30px 20px; 
            text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); min-height: 160px;
        }
        .calc-label { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .calc-value { font-size: 3.5rem; font-weight: 900; line-height: 1; margin: 5px 0; transition: 0.3s; }
        .calc-currency { font-size: 16px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px;}

        /* ألوان القيم */
        .text-coins { color: var(--coin-color); text-shadow: 0 0 25px rgba(251, 197, 49, 0.4); }
        .text-pips { color: var(--pip-color); text-shadow: 0 0 25px rgba(156, 136, 255, 0.4); }
        .text-none { color: rgba(255,255,255,0.1); }

    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="site-grid"></div>

    <header class="app-header">
        <div class="app-brand">Plato<span>X</span></div>
        <button class="lang-btn" onclick="toggleLanguage()" id="langSwitch">AR</button>
    </header>

    <main class="main-container">
        
        <div class="section-tag" id="sectionTitle">SMART CALCULATOR</div>

        <div class="platox-card">
            
            <div class="currency-switch">
                <div class="switch-opt active" id="modeCoins" onclick="setMode('coins')">
                    <i class="fa-solid fa-coins" style="color: var(--coin-color);"></i> <span id="tabCoins">Coins</span>
                </div>
                <div class="switch-opt" id="modePips" onclick="setMode('pips')">
                    <i class="fa-solid fa-gem" style="color: var(--pip-color);"></i> <span id="tabPips">Pips</span>
                </div>
            </div>

            <div class="input-wrapper">
                <!-- inputmode="numeric" يظهر الكيبورد الرقمي في الجوال -->
                <input type="text" inputmode="numeric" id="calcInput" placeholder="Enter Coins..." oninput="handleInput(event)">
                <i class="fa-solid fa-coins" id="inputIcon" style="color: var(--coin-color);"></i>
            </div>

            <div class="calc-display">
                <div class="calc-label" id="resultTitle">ESTIMATED VALUE</div>
                <div class="calc-value text-none" id="resultValue">0</div>
                <div class="calc-currency" id="resultCurrency">PIPS</div>
            </div>

        </div>

    </main>

    <script>
        /* =========================================================================
           نظام اللغات والترجمة الفورية
           ========================================================================= */
        let currentLang = 'en';
        const i18n = {
            en: {
                langBtn: 'AR',
                dir: 'ltr',
                sectionTitle: 'SMART CALCULATOR',
                tabCoins: 'Coins',
                tabPips: 'Pips',
                placeholderCoins: 'Enter Coins...',
                placeholderPips: 'Enter Pips...',
                resultTitle: 'ESTIMATED VALUE',
                currCoins: 'COINS',
                currPips: 'PIPS'
            },
            ar: {
                langBtn: 'EN',
                dir: 'rtl',
                sectionTitle: 'الحاسبة الذكية',
                tabCoins: 'كوينز',
                tabPips: 'بيبس',
                placeholderCoins: 'أدخل عدد الكوينز...',
                placeholderPips: 'أدخل عدد البيبس...',
                resultTitle: 'القيمة التقديرية العادلة',
                currCoins: 'COINS',
                currPips: 'PIPS'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const t = i18n[currentLang];
            
            document.documentElement.setAttribute('dir', t.dir);
            document.documentElement.setAttribute('lang', currentLang);
            
            document.getElementById('langSwitch').innerText = t.langBtn;
            document.getElementById('sectionTitle').innerText = t.sectionTitle;
            document.getElementById('tabCoins').innerText = t.tabCoins;
            document.getElementById('tabPips').innerText = t.tabPips;
            document.getElementById('resultTitle').innerText = t.resultTitle;
            
            document.getElementById('calcInput').placeholder = (currentMode === 'coins') ? t.placeholderCoins : t.placeholderPips;
            document.getElementById('resultCurrency').innerText = (currentMode === 'coins') ? t.currPips : t.currCoins;
        }

        /* =========================================================================
           نظام الحاسبة والذكاء الاصطناعي
           ========================================================================= */
        let currentMode = 'coins'; 

        function setMode(mode) {
            currentMode = mode;
            const t = i18n[currentLang];
            
            document.getElementById('modeCoins').classList.toggle('active', mode === 'coins');
            document.getElementById('modePips').classList.toggle('active', mode === 'pips');

            const input = document.getElementById('calcInput');
            const icon = document.getElementById('inputIcon');
            const resultCurr = document.getElementById('resultCurrency');
            
            if (mode === 'coins') {
                input.placeholder = t.placeholderCoins;
                icon.className = 'fa-solid fa-coins';
                icon.style.color = 'var(--coin-color)';
                resultCurr.innerText = t.currPips;
            } else {
                input.placeholder = t.placeholderPips;
                icon.className = 'fa-solid fa-gem';
                icon.style.color = 'var(--pip-color)';
                resultCurr.innerText = t.currCoins;
            }
            
            // تصفير الحقل عند التبديل
            input.value = ''; 
            calculate();
        }

        // تحويل الأرقام العربية إلى إنجليزية
        const convertArabicNumerals = (str) => {
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        };

        // معالجة الإدخال (تصفية، تحويل، وضع الفواصل)
        function handleInput(e) {
            let val = e.target.value;
            
            // 1. تحويل الأرقام العربية (١٢٣) إلى إنجليزية (123)
            val = convertArabicNumerals(val);
            
            // 2. مسح أي أحرف أو مسافات (الإبقاء على الأرقام فقط)
            val = val.replace(/\D/g, '');
            
            // 3. وضع الفواصل للألوف (مثال: 31,000)
            if(val !== '') {
                val = parseInt(val, 10).toLocaleString('en-US');
            }
            
            e.target.value = val;
            calculate();
        }

        // الخوارزمية الذكية لتقييم السعر العادل بناءً على الكمية
        function getDynamicRate(pips) {
            if (pips <= 0) return 500;
            // المعادلة: الكمية القليلة تقترب من 550 كوينز للبيبس، والكميات الضخمة تستقر عند 400
            return 400 + 150 * Math.exp(-pips / 15);
        }

        function calculate() {
            // أخذ القيمة من الحقل وإزالة الفواصل لتحويلها إلى رقم برمجي
            let rawValue = document.getElementById('calcInput').value.replace(/,/g, '');
            let val = parseFloat(rawValue);
            
            const outVal = document.getElementById('resultValue');

            // في حال كان الحقل فارغاً
            if (isNaN(val) || val <= 0) {
                outVal.innerText = '0';
                outVal.className = 'calc-value text-none';
                return;
            }

            if (currentMode === 'coins') {
                // إدخال كوينز -> إخراج بيبس
                let estimatedPips = val / 450; 
                let actualRate = getDynamicRate(estimatedPips);
                let finalPips = val / actualRate;
                
                // تنسيق الرقم (رقم عشري واحد إذا كان هناك كسر)
                let displayValue = (finalPips % 1 !== 0) ? finalPips.toFixed(1) : finalPips.toString();
                
                // إضافة فواصل للألوف للناتج أيضاً
                let parts = displayValue.split('.');
                parts[0] = parseInt(parts[0]).toLocaleString('en-US');
                
                outVal.innerText = parts.join('.');
                outVal.className = 'calc-value text-pips';
                
            } else {
                // إدخال بيبس -> إخراج كوينز
                let rate = getDynamicRate(val);
                let finalCoins = Math.round(val * rate);
                
                outVal.innerText = finalCoins.toLocaleString('en-US');
                outVal.className = 'calc-value text-coins';
            }
        }
    </script>
</body>
</html>
