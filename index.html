<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlatoX - Explore Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Rajdhani:wght@600;700;900&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0a0f; 
            --bg-card: rgba(18, 18, 26, 0.65); 
            --primary: #ffffff; 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-active-glow: rgba(255, 255, 255, 0.7);
            
            /* ألوان العملات */
            --coin-color: #fbc531;
            --pip-color: #9c88ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: 'Cairo', sans-serif;
            position: relative; min-height: 100vh; overflow-x: hidden;
        }

        .static-gaming-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -3; pointer-events: none;
            background-color: var(--bg-main);
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .glass-panel { 
            background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 8px 30px 0 rgba(0, 0, 0, 0.35); 
        }

        .fit-btn, .cancel-btn {
            border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 10px 15px; font-family: inherit;
        }
        .fit-btn { background: var(--primary); color: var(--bg-main); font-weight: 900; }
        .fit-btn:hover { box-shadow: 0 0 15px var(--btn-active-glow); }
        .cancel-btn { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--glass-border); }

        .view-section { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; padding: 30px 15px; animation: fadeIn 0.3s ease; }
        .view-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 1.7rem; font-weight: 900; margin-bottom: 25px; text-align: center; }
        .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        /* --- تصميم القائمة الرئيسية --- */
        #sim-hub { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 500px; }
        .sim-card { 
            display: flex; align-items: center; gap: 15px; padding: 20px; text-decoration: none; 
            color: var(--text-main); border-radius: 16px; position: relative; overflow: hidden; cursor: pointer; transition: 0.2s;
        }
        .sim-card:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-3px); }
        .sim-card i { font-size: 38px; color: var(--primary); width: 45px; text-align: center; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
        .sim-card-info { display: flex; flex-direction: column; gap: 4px; text-align: right; }
        .sim-card-info h3 { font-weight: 900; font-size: 1.1rem; margin: 0; }
        .sim-card-info p { color: var(--text-muted); font-weight: bold; line-height: 1.4; font-size: 0.85rem; margin: 0; }

        /* --- تصميم الروليت الاحترافي (VIP) --- */
        .roulette-wrapper { width: 100%; max-width: 420px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative;}
        .r-canvas-box { position: relative; margin-bottom: 15px; display: flex; justify-content: center; align-items: center;}
        
        /* إطار معدني للروليت */
        .r-border {
            position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: linear-gradient(145deg, #f5f6fa, #7f8fa6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5); z-index: 1; pointer-events: none;
        }
        
        #rouletteCanvas { 
            border-radius: 50%; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); 
            width: 300px; height: 300px; position: relative; z-index: 2;
        }
        
        /* المؤشر الأنيق */
        .r-pointer { 
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%); 
            width: 30px; height: 35px; background: #e84118;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); z-index: 10;
        }

        .names-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #fff; padding: 12px; border-radius: 8px; font-family: inherit; resize: vertical; min-height: 70px; outline: none; text-align: center; font-weight: bold; }
        .names-input::placeholder { color: rgba(255,255,255,0.4); font-size: 12.5px; font-weight: normal;}
        
        .winner-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(15, 15, 20, 0.98); padding: 25px 20px; border-radius: 16px; border: 2px solid var(--primary); color: #fff; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.9); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 20; width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; pointer-events: none; opacity: 0;}
        .winner-popup.show { transform: translate(-50%, -50%) scale(1); pointer-events: auto; opacity: 1;}
        .winner-name { font-size: 2rem; font-weight: 900; color: #fbc531; text-shadow: 0 0 15px rgba(251, 197, 49, 0.6); }
        .winner-btns { display: flex; gap: 10px; width: 100%; }

        /* --- تصميم الحاسبة --- */
        .calc-wrapper { width: 100%; max-width: 500px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        .calc-toggle { display: flex; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid var(--glass-border); overflow: hidden; width: 100%; }
        .calc-mode-btn { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); font-family: inherit; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .calc-mode-btn.active { background: rgba(255,255,255,0.1); color: var(--primary); }
        .calc-mode-btn i { margin-left: 8px; font-size: 16px; }

        .calc-input-group { width: 100%; position: relative; }
        .calc-input-group i { position: absolute; top: 50%; transform: translateY(-50%); right: 15px; font-size: 22px; color: var(--text-muted); transition: 0.3s;}
        .calc-input-group input { 
            width: 100%; background: rgba(0,0,0,0.3); border: 2px solid var(--glass-border); color: var(--primary); 
            padding: 15px 50px 15px 15px; border-radius: 12px; font-family: 'Rajdhani', 'Cairo', sans-serif; font-size: 22px; font-weight: 900; outline: none; transition: 0.3s; text-align: left;
        }
        .calc-input-group input::placeholder { font-size: 15px; font-weight: normal; color: rgba(255,255,255,0.3); text-align: right; font-family: 'Cairo', sans-serif;}
        .calc-input-group input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .calc-input-group input:focus + i { color: var(--primary); }

        .calc-result-box { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; min-height: 120px; justify-content: center;}
        
        .result-amount { font-size: 3rem; font-family: 'Rajdhani', sans-serif; font-weight: 900; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .result-label { font-size: 15px; font-weight: bold; color: var(--text-muted); }
        
        .text-coins { color: var(--coin-color); text-shadow: 0 0 20px rgba(251, 197, 49, 0.4); }
        .text-pips { color: var(--pip-color); text-shadow: 0 0 20px rgba(156, 136, 255, 0.4); }

        .breakdown-title { font-size: 13px; font-weight: bold; color: var(--text-muted); text-align: right; width: 100%; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; margin-top: 5px;}
        .packages-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; width: 100%; }
        .pkg-card { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 10px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .pkg-count { font-size: 18px; font-weight: 900; font-family: 'Rajdhani', sans-serif; color: var(--primary); }
        .pkg-name { font-size: 12px; font-weight: bold; color: var(--text-muted); }

    </style>
</head>
<body>

    <div class="static-gaming-bg"></div>

    <!-- القائمة الرئيسية -->
    <div id="view-hub" class="view-section active">
        <h2 class="section-title">قسم الاستكشاف</h2>
        <div id="sim-hub">
            <div class="sim-card glass-panel" onclick="openSim('calculator')">
                <i class="fa-solid fa-calculator" style="color: var(--pip-color);"></i>
                <div class="sim-card-info">
                    <h3>حاسبة بلاتو</h3>
                    <p>أداة لحساب تكلفة البيبس والكوينز مع إيجاد الباقات المناسبة للشراء.</p>
                </div>
            </div>
            <div class="sim-card glass-panel" onclick="openSim('roulette')">
                <i class="fa-solid fa-dharmachakra" style="color: var(--coin-color);"></i>
                <div class="sim-card-info">
                    <h3>روليت الأسماء</h3>
                    <p>عجلة حظ احترافية لتدوير واختيار الأسماء للفعاليات والمسابقات.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- الروليت الاحترافي -->
    <div id="view-roulette" class="view-section">
        <div class="top-bar">
            <h2 class="section-title" style="margin: 0;">الروليت</h2>
            <button class="cancel-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        </div>
        <div class="glass-panel roulette-wrapper">
            <div class="r-canvas-box">
                <div class="r-border"></div>
                <div class="r-pointer"></div>
                <canvas id="rouletteCanvas" width="300" height="300"></canvas>
                
                <div id="winnerPopup" class="winner-popup">
                    <span>🎉 الفائز هو 🎉</span>
                    <div class="winner-name" id="winnerNameStr">الاسم</div>
                    <div class="winner-btns">
                        <button class="fit-btn" style="flex: 1; font-size: 12px;" onclick="closeWinnerPopup()">استمرار</button>
                        <button class="cancel-btn" style="flex: 1; color: #ef4444; font-size: 12px;" onclick="removeWinner()">إزالة الفائز</button>
                    </div>
                </div>
            </div>
            <button class="fit-btn" style="width: 100%; height: 45px; font-size: 15px;" onclick="spinRoulette()"><i class="fa-solid fa-rotate-right"></i> فر العجلة</button>
            <textarea id="rouletteNames" class="names-input" placeholder="أدخل الأسماء هنا، افصل بينها بفاصلة (مثال: أحمد, علي, سارة)"></textarea>
            <div style="width: 100%; display: flex; gap: 8px;">
                <button class="cancel-btn" style="flex: 1;" onclick="updateRouletteWheel()"><i class="fa-solid fa-check"></i> تحديث</button>
                <button class="cancel-btn" style="flex: 1; color: #ef4444;" onclick="resetRouletteNames()"><i class="fa-solid fa-rotate-left"></i> إعادة تعيين</button>
            </div>
        </div>
    </div>

    <!-- الحاسبة -->
    <div id="view-calculator" class="view-section">
        <div class="top-bar">
            <h2 class="section-title" style="margin: 0;">حاسبة بلاتو</h2>
            <button class="cancel-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        </div>
        
        <div class="glass-panel calc-wrapper">
            
            <div class="calc-toggle">
                <button class="calc-mode-btn active" id="btnModeCoins" onclick="setCalcMode('coins')"><i class="fa-solid fa-coins" style="color: var(--coin-color);"></i> لدي كوينز</button>
                <button class="calc-mode-btn" id="btnModePips" onclick="setCalcMode('pips')"><i class="fa-solid fa-gem" style="color: var(--pip-color);"></i> أريد بيبس</button>
            </div>

            <div class="calc-input-group">
                <input type="number" id="calcInput" placeholder="أدخل عدد الكوينز (مثال: 31000)" oninput="performCalculation()">
                <i class="fa-solid fa-coins" id="calcInputIcon" style="color: var(--coin-color);"></i>
            </div>

            <div class="calc-result-box">
                <div class="result-label" id="resultLabel">مجموع البيبس:</div>
                <div class="result-amount text-pips" id="resultAmount">0</div>
                
                <div class="breakdown-title" id="breakdownTitle" style="display: none;">الباقات المطلوبة:</div>
                <div class="packages-grid" id="packagesGrid"></div>
            </div>

        </div>
    </div>

    <script>
        function openSim(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            if(viewId === 'roulette') drawRouletteWheel();
            if(viewId === 'calculator') performCalculation();
            window.scrollTo(0,0);
        }

        /* =========================================================================
           1. محاكي الروليت الاحترافي (VIP Smooth Spinning)
           ========================================================================= */
        const rCanvas = document.getElementById("rouletteCanvas");
        const rCtx = rCanvas.getContext("2d");
        const winnerPopup = document.getElementById("winnerPopup");
        
        // ألوان عصرية وجميلة للروليت
        let rNames = ["YYY", "YYY", "YYY"];
        let rColors = ['#1abc9c', '#3498db', '#e74c3c', '#9b59b6', '#f1c40f', '#e67e22', '#2ecc71', '#34495e'];
        
        let currentAngle = 0; 
        let isSpinning = false; 
        let lastWinnerIndex = -1;
        let animationReq;

        document.getElementById('rouletteNames').value = rNames.join(', ');

        function updateRouletteWheel() {
            const text = document.getElementById('rouletteNames').value;
            rNames = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            if(rNames.length === 0) rNames = [];
            winnerPopup.classList.remove('show');
            currentAngle = 0; // تصفير العجلة عند التحديث
            drawRouletteWheel();
        }

        function resetRouletteNames() { 
            document.getElementById('rouletteNames').value = 'YYY, YYY, YYY'; 
            updateRouletteWheel(); 
        }

        function drawRouletteWheel() {
            rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
            const cx = rCanvas.width / 2; 
            const cy = rCanvas.height / 2;
            const outsideRadius = 145; 
            const textRadius = 90; 

            if (rNames.length === 0) {
                rCtx.beginPath(); rCtx.arc(cx, cy, outsideRadius, 0, Math.PI*2);
                rCtx.fillStyle = "rgba(255,255,255,0.05)"; rCtx.fill();
                return;
            }

            const arc = Math.PI * 2 / rNames.length;

            for(let i = 0; i < rNames.length; i++) {
                let angle = currentAngle + i * arc;
                
                // رسم الأجزاء مع تحديد ألوان احترافية
                rCtx.beginPath();
                rCtx.moveTo(cx, cy);
                rCtx.arc(cx, cy, outsideRadius, angle, angle + arc, false);
                rCtx.lineTo(cx, cy);
                rCtx.fillStyle = rColors[i % rColors.length];
                rCtx.fill();
                
                // إطار داخلي بين الأقسام
                rCtx.lineWidth = 2;
                rCtx.strokeStyle = "rgba(0,0,0,0.3)";
                rCtx.stroke();
                
                // رسم الأسماء بخط عريض وواضح مع ظل
                rCtx.save();
                rCtx.fillStyle = "#ffffff"; 
                rCtx.shadowBlur = 4; 
                rCtx.shadowColor = "rgba(0,0,0,0.8)";
                rCtx.translate(cx + Math.cos(angle + arc / 2) * textRadius, cy + Math.sin(angle + arc / 2) * textRadius);
                rCtx.rotate(angle + arc / 2); 
                rCtx.textAlign = "right"; 
                rCtx.textBaseline = "middle";
                rCtx.font = "bold 16px Cairo";
                rCtx.fillText(rNames[i], 40, 0); 
                rCtx.restore();
            }

            // رسم زر الارتكاز المعدني في المنتصف
            rCtx.beginPath();
            rCtx.arc(cx, cy, 20, 0, Math.PI * 2);
            let centerGrad = rCtx.createRadialGradient(cx, cy, 5, cx, cy, 20);
            centerGrad.addColorStop(0, "#ffffff");
            centerGrad.addColorStop(1, "#7f8fa6");
            rCtx.fillStyle = centerGrad;
            rCtx.fill();
            rCtx.lineWidth = 3;
            rCtx.strokeStyle = "#2f3640";
            rCtx.stroke();
            
            // نقطة الارتكاز الصغيرة
            rCtx.beginPath();
            rCtx.arc(cx, cy, 5, 0, Math.PI * 2);
            rCtx.fillStyle = "#2f3640";
            rCtx.fill();
        }

        // خوارزمية الدوران الناعمة (Cubic Ease-Out)
        let spinStart = 0;
        let spinDuration = 0;
        let startRotation = 0;
        let targetRotation = 0;

        function spinRoulette() {
            if(rNames.length === 0 || isSpinning) return;
            isSpinning = true;
            winnerPopup.classList.remove('show');
            
            // تحديد مدة الدوران وعدد اللفات (بين 6 لـ 10 ثواني)
            spinDuration = 5000 + Math.random() * 2000; 
            startRotation = currentAngle;
            // اللفات الإضافية + زاوية عشوائية
            targetRotation = currentAngle + (Math.PI * 2 * (5 + Math.random() * 5)); 
            
            spinStart = performance.now();
            requestAnimationFrame(animateRoulette);
        }

        function animateRoulette(currentTime) {
            let elapsed = currentTime - spinStart;
            
            if(elapsed < spinDuration) {
                let t = elapsed / spinDuration;
                // Easing Function: easeOutQuart لجعل التوقف جداً واقعي وناعم
                let ease = 1 - Math.pow(1 - t, 4);
                currentAngle = startRotation + (targetRotation - startRotation) * ease;
                
                drawRouletteWheel();
                animationReq = requestAnimationFrame(animateRoulette);
            } else {
                currentAngle = targetRotation % (Math.PI * 2);
                isSpinning = false;
                drawRouletteWheel();
                showWinner();
            }
        }

        function showWinner() {
            const arc = Math.PI * 2 / rNames.length;
            // حساب الزاوية التي يشير لها المؤشر (والذي يقع في الأعلى عند 270 درجة أو 1.5 PI)
            let degrees = (currentAngle * 180 / Math.PI) % 360;
            let pointingAngle = (270 - degrees + 360) % 360;
            let arcd = arc * 180 / Math.PI;
            
            let index = Math.floor(pointingAngle / arcd);
            
            lastWinnerIndex = index;
            document.getElementById("winnerNameStr").innerText = rNames[index];
            winnerPopup.classList.add('show');
        }

        function closeWinnerPopup() { winnerPopup.classList.remove('show'); }
        function removeWinner() {
            if (lastWinnerIndex > -1 && lastWinnerIndex < rNames.length) {
                rNames.splice(lastWinnerIndex, 1);
                document.getElementById('rouletteNames').value = rNames.join(', ');
                updateRouletteWheel();
            }
            closeWinnerPopup();
        }

        /* =========================================================================
           2. الحاسبة الصافية والدقيقة (Pure Calculator)
           ========================================================================= */
        
        let calcMode = 'coins'; 
        
        function setCalcMode(mode) {
            calcMode = mode;
            const inputEl = document.getElementById('calcInput');
            const iconEl = document.getElementById('calcInputIcon');
            
            document.getElementById('btnModeCoins').classList.remove('active');
            document.getElementById('btnModePips').classList.remove('active');
            
            if(mode === 'coins') {
                document.getElementById('btnModeCoins').classList.add('active');
                inputEl.placeholder = "أدخل عدد الكوينز (مثال: 31000)";
                iconEl.className = "fa-solid fa-coins";
                iconEl.style.color = "var(--coin-color)";
            } else {
                document.getElementById('btnModePips').classList.add('active');
                inputEl.placeholder = "أدخل عدد البيبس المطلوب (مثال: 75)";
                iconEl.className = "fa-solid fa-gem";
                iconEl.style.color = "var(--pip-color)";
            }
            
            inputEl.value = ''; 
            performCalculation();
        }

        function calculateBestPipsForCoins(targetCoins) {
            if(!targetCoins || targetCoins <= 0) return null;
            let maxSearch = Math.min(targetCoins, 100000); 
            let dp = new Array(maxSearch + 1).fill(0);
            let pkgs = [ {p: 75, c: 31000}, {p: 20, c: 8000}, {p: 16, c: 7000}, {p: 10, c: 5000} ];
            
            let base20 = 0;
            let processCoins = targetCoins;
            if (targetCoins > 100000) {
                let chunks = Math.floor((targetCoins - 50000) / 8000);
                base20 = chunks;
                processCoins = targetCoins - (chunks * 8000);
            }
            
            let path = new Array(processCoins + 1).fill(null);
            
            for (let i = 0; i <= processCoins; i++) {
                for(let pkg of pkgs) {
                    if (i + pkg.c <= processCoins) {
                        if (dp[i] + pkg.p > dp[i + pkg.c]) {
                            dp[i + pkg.c] = dp[i] + pkg.p;
                            path[i + pkg.c] = {prev: i, p: pkg.p};
                        }
                    }
                }
            }
            
            let bestPips = 0; let bestCost = 0;
            for (let i = 0; i <= processCoins; i++) {
                if (dp[i] > bestPips) {
                    bestPips = dp[i]; bestCost = i;
                } else if (dp[i] === bestPips && i < bestCost) { 
                    bestCost = i; 
                }
            }
            
            let breakdown = {75:0, 20: base20, 16:0, 10:0};
            let curr = bestCost;
            while(curr > 0 && path[curr]) {
                breakdown[path[curr].p]++;
                curr = path[curr].prev;
            }
            
            return { pips: bestPips + (base20 * 20), breakdown };
        }

        function calculateBestCoinsForPips(targetPips) {
            if(!targetPips || targetPips <= 0) return null;
            let base20 = 0;
            let processPips = targetPips;
            if (targetPips > 500) {
                let chunks = Math.floor((targetPips - 100) / 20);
                base20 = chunks;
                processPips = targetPips - (chunks * 20);
            }
            
            let maxSearch = processPips + 75; 
            let dp = new Array(maxSearch + 1).fill(Infinity);
            let path = new Array(maxSearch + 1).fill(null);
            dp[0] = 0;
            
            let pkgs = [ {p: 75, c: 31000}, {p: 20, c: 8000}, {p: 16, c: 7000}, {p: 10, c: 5000} ];
            
            for (let i = 0; i <= maxSearch; i++) {
                if (dp[i] === Infinity) continue;
                for (let pkg of pkgs) {
                    let next = i + pkg.p;
                    if (next <= maxSearch) {
                        if (dp[i] + pkg.c < dp[next]) {
                            dp[next] = dp[i] + pkg.c;
                            path[next] = {prev: i, p: pkg.p};
                        }
                    }
                }
            }
            
            let minCoins = Infinity; let bestPips = processPips;
            for (let i = processPips; i <= maxSearch; i++) {
                if (dp[i] < minCoins) { minCoins = dp[i]; bestPips = i; }
            }
            
            let breakdown = {75:0, 20: base20, 16:0, 10:0};
            let curr = bestPips;
            while(curr > 0 && path[curr]) {
                breakdown[path[curr].p]++;
                curr = path[curr].prev;
            }
            
            return { coins: minCoins + (base20 * 8000), breakdown };
        }

        function performCalculation() {
            let val = parseInt(document.getElementById('calcInput').value);
            const amountEl = document.getElementById('resultAmount');
            const labelEl = document.getElementById('resultLabel');
            const gridEl = document.getElementById('packagesGrid');
            const titleEl = document.getElementById('breakdownTitle');
            
            gridEl.innerHTML = '';

            if (isNaN(val) || val <= 0) {
                amountEl.innerText = '0';
                amountEl.className = 'result-amount text-muted';
                labelEl.innerText = 'بانتظار الإدخال...';
                titleEl.style.display = 'none';
                return;
            }

            if (calcMode === 'coins') {
                let res = calculateBestPipsForCoins(val);
                if (res && res.pips > 0) {
                    amountEl.innerText = res.pips.toLocaleString();
                    amountEl.className = 'result-amount text-pips';
                    labelEl.innerText = 'مجموع البيبس:';
                    titleEl.style.display = 'block';
                    renderBreakdown(res.breakdown);
                } else {
                    amountEl.innerText = '0';
                    amountEl.className = 'result-amount text-muted';
                    labelEl.innerText = 'المبلغ غير كافٍ لشراء أي باقة';
                    titleEl.style.display = 'none';
                }
            } else {
                let res = calculateBestCoinsForPips(val);
                if (res) {
                    amountEl.innerText = res.coins.toLocaleString();
                    amountEl.className = 'result-amount text-coins';
                    labelEl.innerText = 'التكلفة الإجمالية (كوينز):';
                    titleEl.style.display = 'block';
                    renderBreakdown(res.breakdown);
                }
            }
        }

        function renderBreakdown(bd) {
            const gridEl = document.getElementById('packagesGrid');
            const order = [75, 20, 16, 10];
            let html = '';
            for(let p of order) {
                if(bd[p] > 0) {
                    html += `
                    <div class="pkg-card">
                        <span class="pkg-count">${bd[p]}x</span>
                        <span class="pkg-name">باقة ${p} بيبس</span>
                    </div>`;
                }
            }
            gridEl.innerHTML = html;
        }

    </script>
</body>
