<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlatoX Simulators Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Rajdhani:wght@600;700;900&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0a0f; 
            --bg-card: rgba(18, 18, 26, 0.65); 
            --primary: #ffffff; 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-active-glow: rgba(255, 255, 255, 0.7);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            margin: 0; padding: 20px 0;
            display: flex; flex-direction: column; align-items: center;
        }

        .section-title { font-size: 1.7rem; font-weight: 900; margin-bottom: 25px; text-align: center; }
        
        .glass-panel { 
            background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 8px 30px 0 rgba(0, 0, 0, 0.35); 
        }

        .fit-btn, .cancel-btn {
            border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 10px 15px;
        }
        .fit-btn { background: var(--primary); color: var(--bg-main); font-weight: 900; }
        .fit-btn:hover { box-shadow: 0 0 15px var(--btn-active-glow); }
        .cancel-btn { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--glass-border); }

        /* --- تصميم القائمة الرئيسية (Hub) --- */
        #sim-hub {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 600px; padding: 0 15px;
        }
        .sim-card {
            flex: 1; min-width: 250px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .sim-card:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.3); }
        .sim-card i { font-size: 40px; color: var(--primary); margin-bottom: 15px; }
        .sim-card h3 { margin: 0; font-size: 1.2rem; font-weight: 900; }
        
        .back-btn { margin-bottom: 20px; align-self: flex-start; margin-right: 15px; }

        /* --- تصميم الروليت --- */
        .roulette-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; padding: 20px; gap: 15px; }
        .roulette-canvas-wrapper { position: relative; margin-bottom: 10px; }
        #rouletteCanvas { border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.5); border: 4px solid #fff; }
        .roulette-pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid #ef4444; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); z-index: 10;
        }
        .names-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #fff;
            padding: 12px; border-radius: 10px; font-family: 'Cairo', sans-serif; resize: vertical; min-height: 80px;
        }
        .winner-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 15, 20, 0.95); padding: 20px 40px; border-radius: 12px;
            border: 2px solid var(--primary); color: #fff; font-size: 1.5rem; font-weight: 900;
            text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); transition: 0.3s; z-index: 20;
        }
        .winner-popup.show { transform: translate(-50%, -50%) scale(1); }

        /* --- تصميم البلياردو --- */
        .billiards-card {
            width: 100%; max-width: 600px; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .billiards-controls-bar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; width: 100%; }
        .billiards-input-box {
            display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px; border-radius: 10px; border: 1px solid var(--glass-border);
        }
        .billiards-input-box input {
            width: 45px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
            color: var(--primary); text-align: center; border-radius: 6px; padding: 4px; font-weight: 900; outline: none;
        }
        .billiards-canvas-container {
            width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; margin-top: 5px;
        }
        #billiardsCanvas {
            width: 100%; 
            max-width: 290px; /* تم تصغير الطاولة */
            height: auto; aspect-ratio: 400 / 750; border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 25px rgba(0,0,0,0.9);
            touch-action: none; cursor: grab; background: #4a2c11;
        }
        #billiardsCanvas:active { cursor: grabbing; }
        .billiards-status-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 290px; margin-top: 15px; padding: 0 5px; font-size: 13.5px; color: var(--primary); font-weight: 900;
        }

        /* حاويات العرض */
        .view-section { display: none; width: 100%; max-width: 800px; flex-direction: column; align-items: center; }
        .view-section.active { display: flex; }
    </style>
</head>
<body>

    <h2 class="section-title">مركز المحاكيات</h2>

    <!-- 1. القائمة الرئيسية (Hub) -->
    <div id="view-hub" class="view-section active">
        <div id="sim-hub">
            <div class="sim-card glass-panel" onclick="openSim('roulette')">
                <i class="fa-solid fa-dharmachakra"></i>
                <h3>روليت الأسماء</h3>
                <p style="font-size: 12px; color: var(--text-muted);">عجلة حظ لتدوير واختيار الأسماء العشوائية.</p>
            </div>
            <div class="sim-card glass-panel" onclick="openSim('billiards')">
                <i class="fa-solid fa-bowling-ball"></i>
                <h3>محاكي البلياردو</h3>
                <p style="font-size: 12px; color: var(--text-muted);">محاكي وزنية احترافي لكرات 8-Ball.</p>
            </div>
        </div>
    </div>

    <!-- 2. محاكي الروليت (Roulette) -->
    <div id="view-roulette" class="view-section">
        <button class="cancel-btn back-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
        
        <div class="glass-panel roulette-container">
            <div class="roulette-canvas-wrapper">
                <div class="roulette-pointer"></div>
                <canvas id="rouletteCanvas" width="320" height="320"></canvas>
                <div id="winnerPopup" class="winner-popup">الفائز!</div>
            </div>

            <div style="width: 100%; display: flex; gap: 10px;">
                <button class="fit-btn" style="flex: 1; height: 42px;" onclick="spinRoulette()"><i class="fa-solid fa-rotate-right"></i> فر العجلة</button>
            </div>
            
            <textarea id="rouletteNames" class="names-input" placeholder="أدخل الأسماء هنا، افصل بينها بفاصلة أو سطر جديد">أحمد, محمد, علي, عمر, سارة, فاطمة</textarea>
            
            <div style="width: 100%; display: flex; gap: 10px;">
                <button class="cancel-btn" style="flex: 1;" onclick="updateRouletteWheel()"><i class="fa-solid fa-check"></i> تحديث الأسماء</button>
                <button class="cancel-btn" style="flex: 1; color: #ef4444;" onclick="clearRouletteNames()"><i class="fa-solid fa-trash"></i> مسح</button>
            </div>
        </div>
    </div>

    <!-- 3. محاكي البلياردو (Billiards) -->
    <div id="view-billiards" class="view-section">
        <button class="cancel-btn back-btn" onclick="openSim('hub')"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
        
        <div class="glass-panel billiards-card">
            <p style="text-align: center; color: var(--text-muted); max-width: 500px; font-size: 13.5px; margin: 0; font-weight: 700;">
                اسحب الكرة البيضاء للتسديد، أو اسحب أي كرة لتغيير مكانها، مع مسار احترافي.
            </p>

            <div class="billiards-controls-bar">
                <div class="billiards-input-box">
                    <label>الكرات:</label>
                    <input type="number" id="ballCountInput" min="1" max="15" value="15">
                </div>

                <button type="button" class="fit-btn" onclick="initPoolBalls('triangle')" style="height: 36px; padding: 0 12px;">
                    <i class="fa-solid fa-play"></i> مثلث نظامي
                </button>
                <!-- تم إزالة زر الترتيب الطولي بناءً على طلبك -->
                <button type="button" class="cancel-btn" onclick="initPoolBalls('clear')" style="height: 36px; padding: 0 12px; color: #ef4444;">
                    <i class="fa-solid fa-trash"></i> مسح
                </button>
            </div>

            <div class="billiards-canvas-container">
                <canvas id="billiardsCanvas" width="400" height="750"></canvas>
                <div class="billiards-status-bar">
                    <span id="billiards-power-text"><i class="fa-solid fa-bolt"></i> القوة: 0%</span>
                    <span id="billiards-active-balls"><i class="fa-solid fa-circle"></i> الكرات: 15</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- دالة التنقل بين المحاكيات ---
        function openSim(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            // إعادة رسم الكانفاس لتجنب أخطاء الأبعاد عند الفتح
            if(viewId === 'roulette') drawRouletteWheel();
            if(viewId === 'billiards') drawPoolTable();
        }

        /* =========================================================================
           1. محاكي الروليت (Roulette Simulator)
           ========================================================================= */
        const rCanvas = document.getElementById("rouletteCanvas");
        const rCtx = rCanvas.getContext("2d");
        const winnerPopup = document.getElementById("winnerPopup");
        
        let rNames = [];
        let rColors = ['#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471', '#34495E', '#16A085', '#E67E22'];
        let startAngle = 0;
        let arc = 0;
        let spinTimeout = null;
        let spinArcStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        
        function updateRouletteWheel() {
            const text = document.getElementById('rouletteNames').value;
            // تقسيم الأسماء بناءً على الفاصلة أو النزول لسطر جديد
            rNames = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            if(rNames.length === 0) rNames = ["فارغ"];
            arc = Math.PI / (rNames.length / 2);
            winnerPopup.classList.remove('show');
            drawRouletteWheel();
        }

        function clearRouletteNames() {
            document.getElementById('rouletteNames').value = '';
            updateRouletteWheel();
        }

        function drawRouletteWheel() {
            rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
            let outsideRadius = 150;
            let textRadius = 105;
            let insideRadius = 25;
            const cx = rCanvas.width / 2;
            const cy = rCanvas.height / 2;

            for(let i = 0; i < rNames.length; i++) {
                let angle = startAngle + i * arc;
                rCtx.fillStyle = rColors[i % rColors.length];
                
                rCtx.beginPath();
                rCtx.arc(cx, cy, outsideRadius, angle, angle + arc, false);
                rCtx.arc(cx, cy, insideRadius, angle + arc, angle, true);
                rCtx.fill();
                
                rCtx.save();
                rCtx.fillStyle = "#ffffff";
                rCtx.shadowBlur = 2; rCtx.shadowColor = "rgba(0,0,0,0.5)";
                rCtx.translate(cx + Math.cos(angle + arc / 2) * textRadius, cy + Math.sin(angle + arc / 2) * textRadius);
                rCtx.rotate(angle + arc / 2);
                rCtx.textAlign = "right";
                rCtx.font = "bold 15px Cairo";
                rCtx.fillText(rNames[i], 30, 5);
                rCtx.restore();
            }
            // الدائرة المركزية
            rCtx.beginPath(); rCtx.arc(cx, cy, insideRadius, 0, Math.PI * 2); rCtx.fillStyle = "#111"; rCtx.fill();
        }

        function spinRoulette() {
            if(rNames.length <= 1) return;
            winnerPopup.classList.remove('show');
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3 + 4 * 1000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawRouletteWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            let degrees = startAngle * 180 / Math.PI + 90;
            let arcd = arc * 180 / Math.PI;
            let index = Math.floor((360 - degrees % 360) / arcd);
            
            winnerPopup.innerHTML = "🎉 " + rNames[index] + " 🎉";
            winnerPopup.classList.add('show');
        }

        function easeOut(t, b, c, d) {
            let ts = (t/=d)*t;
            let tc = ts*t;
            return b+c*(tc + -3*ts + 3*t);
        }
        
        // التهيئة الأولية للروليت
        updateRouletteWheel();


        /* =========================================================================
           2. محاكي البلياردو (Billiards Simulator)
           ========================================================================= */
        const poolCanvas = document.getElementById('billiardsCanvas');
        const poolCtx = poolCanvas.getContext('2d');

        const TABLE_WIDTH = 400;
        const TABLE_HEIGHT = 750;
        const CUSHION = 32; 
        const PLAY_LEFT = CUSHION;
        const PLAY_RIGHT = TABLE_WIDTH - CUSHION;
        const PLAY_TOP = CUSHION;
        const PLAY_BOTTOM = TABLE_HEIGHT - CUSHION;
        const BALL_RADIUS = 11.5;
        const POCKET_RADIUS = 23;
        const FRICTION = 0.985; 

        const POCKETS = [
            { x: PLAY_LEFT, y: PLAY_TOP }, { x: PLAY_RIGHT, y: PLAY_TOP },
            { x: PLAY_LEFT, y: TABLE_HEIGHT / 2 }, { x: PLAY_RIGHT, y: TABLE_HEIGHT / 2 },
            { x: PLAY_LEFT, y: PLAY_BOTTOM }, { x: PLAY_RIGHT, y: PLAY_BOTTOM }
        ];

        const BALL_COLORS = ['#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471', '#2D3436', '#F9CA24', '#0984E3', '#D63031', '#6C5CE7', '#E17055', '#00B894', '#B53471'];

        let poolBalls = [];
        let poolCueBall = null;
        let isAiming = false;
        let draggedBall = null;
        let aimStartPos = { x: 0, y: 0 };
        let aimCurrentPos = { x: 0, y: 0 };
        let currentShotPower = 0;

        class PoolBall {
            constructor(x, y, color = '#ffffff', number = 0, isCue = false) {
                this.x = x; this.y = y; this.vx = 0; this.vy = 0;
                this.radius = BALL_RADIUS; this.color = color;
                this.number = number; this.isCue = isCue; this.inPocket = false;
            }
            draw() {
                if (this.inPocket) return;
                poolCtx.save();
                poolCtx.translate(this.x, this.y);
                
                poolCtx.beginPath(); poolCtx.arc(1.5, 2, this.radius, 0, Math.PI * 2);
                poolCtx.fillStyle = 'rgba(0, 0, 0, 0.4)'; poolCtx.fill();

                const grad = poolCtx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, 1, 0, 0, this.radius);
                grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, this.color); grad.addColorStop(1, '#111');
                poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius, 0, Math.PI * 2);
                poolCtx.fillStyle = grad; poolCtx.fill();

                if (!this.isCue && this.number > 0) {
                    poolCtx.beginPath(); poolCtx.arc(0, 0, this.radius * 0.5, 0, Math.PI * 2);
                    poolCtx.fillStyle = '#fff'; poolCtx.fill();
                    poolCtx.fillStyle = '#000'; poolCtx.font = 'bold 10px Rajdhani';
                    poolCtx.textAlign = 'center'; poolCtx.textBaseline = 'middle';
                    poolCtx.fillText(this.number, 0, 0.5);
                }
                poolCtx.restore();
            }
            update() {
                if (this.inPocket) return;
                this.x += this.vx; this.y += this.vy;
                this.vx *= FRICTION; this.vy *= FRICTION;

                if (Math.hypot(this.vx, this.vy) < 0.05) { this.vx = 0; this.vy = 0; }

                if (this.x - this.radius < PLAY_LEFT) { this.x = PLAY_LEFT + this.radius; this.vx = -this.vx; } 
                else if (this.x + this.radius > PLAY_RIGHT) { this.x = PLAY_RIGHT - this.radius; this.vx = -this.vx; }
                if (this.y - this.radius < PLAY_TOP) { this.y = PLAY_TOP + this.radius; this.vy = -this.vy; } 
                else if (this.y + this.radius > PLAY_BOTTOM) { this.y = PLAY_BOTTOM - this.radius; this.vy = -this.vy; }

                for (let p of POCKETS) {
                    if (Math.hypot(this.x - p.x, this.y - p.y) < POCKET_RADIUS - 2) {
                        this.inPocket = true; this.vx = 0; this.vy = 0;
                        if (this.isCue) setTimeout(() => { this.inPocket = false; this.x = TABLE_WIDTH/2; this.y = TABLE_HEIGHT*0.75; }, 1000);
                        updateBilliardsCounters(); break;
                    }
                }
            }
        }

        function initPoolBalls(mode = 'triangle') {
            poolBalls = [];
            poolCueBall = new PoolBall(TABLE_WIDTH / 2, TABLE_HEIGHT * 0.75, '#ffffff', 0, true);
            poolBalls.push(poolCueBall);

            let count = parseInt(document.getElementById('ballCountInput').value) || 15;
            count = Math.min(15, Math.max(1, count));

            if (mode === 'triangle') {
                const apexX = TABLE_WIDTH / 2;
                const apexY = PLAY_TOP + 100;
                let bIdx = 0;
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col <= row; col++) {
                        if (bIdx >= count) break;
                        let bx = apexX + (col * BALL_RADIUS * 2.1) - (row * BALL_RADIUS * 1.05);
                        let by = apexY + (row * BALL_RADIUS * 1.8);
                        poolBalls.push(new PoolBall(bx, by, BALL_COLORS[bIdx % 15], bIdx + 1));
                        bIdx++;
                    }
                }
            } // وضع الـ clear يترك الكرة البيضاء فقط
            
            updateBilliardsCounters();
        }

        function updateBilliardsCounters() {
            const count = poolBalls.filter(b => !b.isCue && !b.inPocket).length;
            document.getElementById('billiards-active-balls').innerHTML = `<i class="fa-solid fa-circle"></i> الكرات: ${count}`;
        }

        function getAimPrediction(cue, angle) {
            let dx = Math.cos(angle), dy = Math.sin(angle);
            let closestT = Infinity, hitType = 'none', hitTarget = null;
            
            let tx = dx > 0 ? (PLAY_RIGHT - BALL_RADIUS - cue.x) / dx : dx < 0 ? (PLAY_LEFT + BALL_RADIUS - cue.x) / dx : Infinity;
            let ty = dy > 0 ? (PLAY_BOTTOM - BALL_RADIUS - cue.y) / dy : dy < 0 ? (PLAY_TOP + BALL_RADIUS - cue.y) / dy : Infinity;
            if (tx > 0 && tx < closestT) { closestT = tx; hitType = 'wall'; }
            if (ty > 0 && ty < closestT) { closestT = ty; hitType = 'wall'; }

            for (let b of poolBalls) {
                if (b === cue || b.inPocket) continue;
                let vX = cue.x - b.x, vY = cue.y - b.y;
                let b_coef = 2 * (vX * dx + vY * dy);
                let c_coef = vX * vX + vY * vY - (BALL_RADIUS*2)*(BALL_RADIUS*2);
                let disc = b_coef * b_coef - 4 * c_coef;
                if (disc >= 0) {
                    let t = (-b_coef - Math.sqrt(disc)) / 2;
                    if (t > 0 && t < closestT) { closestT = t; hitType = 'ball'; hitTarget = b; }
                }
            }
            return { t: closestT, type: hitType, target: hitTarget, dx, dy };
        }

        function drawPoolTable() {
            poolCtx.clearRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            poolCtx.fillStyle = '#4a2c11'; poolCtx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
            poolCtx.fillStyle = '#439955'; poolCtx.fillRect(PLAY_LEFT, PLAY_TOP, PLAY_RIGHT - PLAY_LEFT, PLAY_BOTTOM - PLAY_TOP);

            poolCtx.strokeStyle = 'rgba(255,255,255,0.2)'; poolCtx.lineWidth = 1.5;
            poolCtx.beginPath(); poolCtx.moveTo(PLAY_LEFT, TABLE_HEIGHT * 0.75); poolCtx.lineTo(PLAY_RIGHT, TABLE_HEIGHT * 0.75); poolCtx.stroke();
            poolCtx.beginPath(); poolCtx.arc(TABLE_WIDTH/2, TABLE_HEIGHT*0.75, 45, Math.PI, 0); poolCtx.stroke();

            POCKETS.forEach(p => {
                poolCtx.beginPath(); poolCtx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI*2);
                poolCtx.fillStyle = '#0a0a0a'; poolCtx.fill();
            });

            poolBalls.forEach(b => b.draw());

            if (isAiming && poolCueBall && !poolCueBall.inPocket && !draggedBall) {
                let pullX = aimStartPos.x - aimCurrentPos.x;
                let pullY = aimStartPos.y - aimCurrentPos.y;
                let dist = Math.hypot(pullX, pullY);

                if (dist > 10) { // تعديل الحساسية
                    let angle = Math.atan2(pullY, pullX);
                    let pred = getAimPrediction(poolCueBall, angle);
                    
                    let ghostX = poolCueBall.x + pred.dx * pred.t;
                    let ghostY = poolCueBall.y + pred.dy * pred.t;

                    poolCtx.beginPath(); poolCtx.moveTo(poolCueBall.x, poolCueBall.y); poolCtx.lineTo(ghostX, ghostY);
                    poolCtx.strokeStyle = 'rgba(255,255,255,0.8)'; poolCtx.lineWidth = 1.5; poolCtx.stroke();

                    if (pred.type === 'ball') {
                        poolCtx.beginPath(); poolCtx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI*2);
                        poolCtx.strokeStyle = 'rgba(255,255,255,0.6)'; poolCtx.lineWidth = 1; poolCtx.stroke();

                        let nx = pred.target.x - ghostX, ny = pred.target.y - ghostY;
                        let nLen = Math.hypot(nx, ny); nx /= nLen; ny /= nLen;
                        poolCtx.beginPath(); poolCtx.moveTo(pred.target.x, pred.target.y);
                        poolCtx.lineTo(pred.target.x + nx * 180, pred.target.y + ny * 180);
                        poolCtx.strokeStyle = '#ff3333'; poolCtx.lineWidth = 2.5; poolCtx.stroke();

                        let tx = -ny, ty = nx;
                        if (pred.dx * tx + pred.dy * ty < 0) { tx = -tx; ty = -ty; }
                        poolCtx.beginPath(); poolCtx.moveTo(ghostX, ghostY); poolCtx.lineTo(ghostX + tx * 50, ghostY + ty * 50);
                        poolCtx.strokeStyle = 'rgba(255,255,255,0.8)'; poolCtx.lineWidth = 1.5; poolCtx.stroke();
                    }
                }
            }
        }

        function poolGameLoop() {
            for(let i=0; i<poolBalls.length; i++) {
                for(let j=i+1; j<poolBalls.length; j++) {
                    let b1 = poolBalls[i], b2 = poolBalls[j];
                    if(b1.inPocket || b2.inPocket) continue;
                    let dx = b2.x - b1.x, dy = b2.y - b1.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < BALL_RADIUS * 2) {
                        let overlap = (BALL_RADIUS * 2) - dist;
                        let nx = dx / dist, ny = dy / dist;
                        b1.x -= nx * (overlap/2); b1.y -= ny * (overlap/2);
                        b2.x += nx * (overlap/2); b2.y += ny * (overlap/2);
                        let kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / 2;
                        b1.vx -= p * nx; b1.vy -= p * ny;
                        b2.vx += p * nx; b2.vy += p * ny;
                    }
                }
            }
            poolBalls.forEach(b => b.update());
            drawPoolTable();
            requestAnimationFrame(poolGameLoop);
        }

        function getCanvasCoordinates(e) {
            const rect = poolCanvas.getBoundingClientRect();
            const scaleX = TABLE_WIDTH / rect.width;
            const scaleY = TABLE_HEIGHT / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function handlePointerDown(e) {
            const pos = getCanvasCoordinates(e);
            draggedBall = poolBalls.find(b => !b.inPocket && Math.hypot(b.x - pos.x, b.y - pos.y) < BALL_RADIUS * 2);
            if (draggedBall) {
                isAiming = false;
            } else if (poolCueBall && !poolCueBall.inPocket) {
                isAiming = true; aimStartPos = pos; aimCurrentPos = pos;
            }
        }

        function handlePointerMove(e) {
            const pos = getCanvasCoordinates(e);
            if (draggedBall) {
                draggedBall.x = Math.max(PLAY_LEFT + BALL_RADIUS, Math.min(PLAY_RIGHT - BALL_RADIUS, pos.x));
                draggedBall.y = Math.max(PLAY_TOP + BALL_RADIUS, Math.min(PLAY_BOTTOM - BALL_RADIUS, pos.y));
                draggedBall.vx = 0; draggedBall.vy = 0; return;
            }
            if (isAiming) {
                aimCurrentPos = pos;
                let dist = Math.hypot(aimStartPos.x - pos.x, aimStartPos.y - pos.y);
                currentShotPower = Math.min(100, Math.round((dist / 140) * 100));
                document.getElementById('billiards-power-text').innerHTML = `<i class="fa-solid fa-bolt"></i> القوة: ${currentShotPower}%`;
            }
        }

        function handlePointerUp(e) {
            if (draggedBall) { draggedBall = null; return; }
            if (!isAiming || !poolCueBall) return;
            isAiming = false;

            let pullX = aimStartPos.x - aimCurrentPos.x;
            let pullY = aimStartPos.y - aimCurrentPos.y;
            let dist = Math.hypot(pullX, pullY);

            // تم حل مشكلة الحساسية (الكرة لن تضرب إلا إذا تم سحبها مسافة واضحة)
            if (dist > 20) {
                let angle = Math.atan2(pullY, pullX);
                let power = Math.min(27, dist * 0.17);
                poolCueBall.vx = Math.cos(angle) * power;
                poolCueBall.vy = Math.sin(angle) * power;
            }
            document.getElementById('billiards-power-text').innerHTML = `<i class="fa-solid fa-bolt"></i> القوة: 0%`;
        }

        poolCanvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        poolCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if(isAiming || draggedBall) { e.preventDefault(); handlePointerMove(e); } }, { passive: false });
        window.addEventListener('touchend', (e) => { if(isAiming || draggedBall) handlePointerUp(e); }, { passive: false });

        initPoolBalls('triangle');
        requestAnimationFrame(poolGameLoop);

    </script>
</body>
</html>
